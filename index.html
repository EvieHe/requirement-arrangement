<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>xdpai · 需求智能评估与排期</title>
<style>
:root{
  --bg:#f5f6fa;--panel:#fff;--line:#e7e9f0;--text:#182033;--muted:#6e7585;
  --purple:#6557e6;--purple2:#8d80f5;--purpleSoft:#f1efff;
  --green:#2f9d68;--greenSoft:#eaf7f0;--blue:#4a78e6;--blueSoft:#edf2ff;
  --amber:#c98a2f;--amberSoft:#fff5df;--red:#c96557;--redSoft:#fff0ec;
  --shadow:0 8px 26px rgba(28,37,64,.055);--r:16px;
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
button,input,select{font:inherit}.app{min-height:100vh}
.topbar{height:58px;padding:0 28px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:11px;font-weight:800}.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--purple),#9b8cff);color:white;display:grid;place-items:center}.brand-sub{font-size:15px}.team{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:9px}.avatar{width:28px;height:28px;border-radius:50%;background:var(--purpleSoft);color:var(--purple);display:grid;place-items:center;font-weight:800}
.wrap{max-width:1680px;margin:0 auto;padding:18px 20px 90px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hero{padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px}.hero h1{margin:0;font-size:22px;letter-spacing:-.3px}.hero p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.65;max-width:900px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.tag{font-size:11px;padding:4px 8px;border-radius:999px;background:#f1f2f6;color:#5f6675}.tag.purple{background:var(--purpleSoft);color:var(--purple)}.tag.orange{background:#fff1e7;color:#d3714d}
.btn{border:1px solid var(--line);background:#fff;color:#394050;padding:9px 14px;border-radius:10px;cursor:pointer;transition:.15s}.btn:hover{border-color:#c6c0fb;box-shadow:0 4px 12px rgba(101,87,230,.11)}.btn.primary{background:var(--purple);border-color:var(--purple);color:white}.btn.soft{background:var(--purpleSoft);border-color:transparent;color:var(--purple);font-weight:700}.btn:disabled{opacity:.45;cursor:not-allowed}
.status-card{margin-top:12px;padding:18px 20px;display:grid;grid-template-columns:260px minmax(0,1fr) 280px;gap:22px;align-items:center}
.progress-num{font-size:31px;font-weight:850;letter-spacing:-.7px}.progress-label{font-size:12px;color:var(--muted);margin-bottom:5px}.progress-track{height:8px;border-radius:99px;background:#eceef4;overflow:hidden;margin-top:10px}.progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--purple2));border-radius:99px;transition:.3s}
.stage-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.stage{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:10px;background:#f7f8fb;font-size:11px;color:#5b6272}.stage.done{background:var(--greenSoft);color:var(--green)}.stage.pending{background:var(--amberSoft);color:#956820}.stage-dot{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10px;background:#fff;border:1px solid currentColor}
.status-side{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini-stat{border:1px solid var(--line);border-radius:11px;padding:10px 11px}.mini-stat b{display:block;font-size:18px}.mini-stat span{font-size:11px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}.section-title{font-size:16px;font-weight:800}.section-sub{margin-top:4px;color:var(--muted);font-size:12px}.count-pill{font-size:11px;padding:5px 9px;border-radius:999px;background:var(--amberSoft);color:#956820}
.clarify{margin-top:12px;padding:18px 20px}.clarify-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.qcard{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff}.qcard.done{background:#fbfffd;border-color:#d9eee2}.qtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.qtitle{font-size:13px;font-weight:750;line-height:1.5}.qmeta{font-size:10px;padding:3px 7px;border-radius:999px;background:var(--purpleSoft);color:var(--purple);white-space:nowrap}.qdesc{font-size:11px;color:var(--muted);line-height:1.55;margin-top:7px}.control{margin-top:12px}.control select,.control input{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 10px;font-size:12px;color:#394050}.radio-group{display:flex;gap:7px;flex-wrap:wrap}.radio-chip{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:11px;cursor:pointer}.radio-chip.active{border-color:#b8b0ff;background:var(--purpleSoft);color:var(--purple);font-weight:700}
.impact{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:10px;color:#8b92a2}.clarify-actions{display:flex;justify-content:flex-end;margin-top:12px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;margin-top:12px;align-items:start}
.plan{overflow:hidden}.plan-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.plan-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip{font-size:11px;padding:5px 8px;border-radius:999px;background:#f3f4f8;color:#5f6675}.chip.front{background:var(--greenSoft);color:var(--green)}.chip.back{background:var(--blueSoft);color:var(--blue)}.chip.other{background:var(--amberSoft);color:var(--amber)}
.plan-tools{display:flex;gap:8px;align-items:center}.plan-tools select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:11px;color:#4d5463}
.gantt-wrap{overflow:auto}.gantt{min-width:1180px}.g-head,.group-row,.task-row{display:grid;grid-template-columns:290px 98px 76px 88px 88px repeat(5,minmax(86px,1fr));align-items:stretch}
.g-head{background:#fafbfe;border-bottom:1px solid var(--line);font-size:10px;color:#677080;font-weight:750}.g-head>div{padding:10px 8px;border-right:1px solid #eef0f5;text-align:center}.g-head>div:first-child{text-align:left}
.group-row{background:#fcfcff;border-bottom:1px solid var(--line);font-size:11px;font-weight:750}.group-label{grid-column:1/6;padding:9px 11px}.group-fill{grid-column:6/11;border-left:1px solid #eef0f5}
.task-row{min-height:56px;border-bottom:1px solid #eef0f5;font-size:11px;cursor:pointer}.task-row:hover{background:#fbfbff}.task-row.selected{background:#f8f7ff}.cell{display:flex;align-items:center;padding:8px;border-right:1px solid #f0f1f5}.task-cell{gap:7px;font-weight:650}.task-id{font-size:9px;padding:2px 5px;background:#f0f2f7;border-radius:5px;color:#848b9a}.editable{width:100%;border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 7px;font-size:11px;color:#333a48}.editable:hover,.editable:focus{border-color:#cfcaf8;background:#fff;outline:none}.num{max-width:62px}.day{position:relative;border-right:1px solid #f0f1f5}.bar{position:absolute;left:7px;right:7px;top:15px;height:25px;border-radius:7px;color:#fff;display:flex;align-items:center;padding:0 8px;font-size:9px;font-weight:800;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.08)}.bar.frontend{background:linear-gradient(90deg,#38a76e,#57bd86)}.bar.backend{background:linear-gradient(90deg,#4e7ee9,#6d95ef)}.bar.other{background:linear-gradient(90deg,#d09838,#e1aa4f)}.bar.critical{outline:2px solid rgba(101,87,230,.33);outline-offset:2px}
.side{position:sticky;top:70px;overflow:hidden}.side-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.side-head b{font-size:13px}.side-body{padding:17px}.side-title{font-size:16px;font-weight:800;margin:9px 0 12px}.kv{display:grid;grid-template-columns:80px 1fr;gap:8px;font-size:11px;margin:8px 0}.kv .k{color:var(--muted)}.detail-sec{margin-top:16px}.detail-sec h3{font-size:12px;margin:0 0 7px}.detail-sec p,.detail-sec li{font-size:11px;color:#555d6c;line-height:1.65}.detail-sec ul{padding-left:17px;margin:6px 0}.riskbox{margin-top:14px;padding:10px 11px;border-radius:10px;background:var(--amberSoft);color:#8c651f;font-size:10px;line-height:1.55}
.footerbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:25}.footer-inner{max-width:1680px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;gap:16px;align-items:center}.footer-summary{display:flex;gap:18px;align-items:center;font-size:12px;color:#596071}.footer-summary b{color:var(--text)}.footer-actions{display:flex;gap:8px}.saved{font-size:11px;color:var(--green);display:none}.saved.show{display:inline}
@media(max-width:1180px){.status-card{grid-template-columns:1fr}.clarify-grid{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.side{position:static}.status-side{max-width:420px}}
@media(max-width:760px){.wrap{padding:12px 12px 100px}.hero{grid-template-columns:1fr}.clarify-grid{grid-template-columns:1fr}.footer-inner{align-items:flex-start;flex-direction:column}.footerbar{position:static}.wrap{padding-bottom:20px}.topbar{padding:0 14px}.brand-sub{font-size:13px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="logo">✦</div><div>xdpai</div><div class="brand-sub">需求智能评估</div></div><div class="team"><span>研发小组</span><div class="avatar">研</div></div></header>

<main class="wrap">
<section class="card hero">
  <div><h1 id="reqTitle"></h1><p id="reqDesc"></p><div class="tags"><span class="tag purple">AI 评估草案</span><span class="tag orange" id="priorityTag"></span><span class="tag" id="reqId"></span></div></div>
  <button class="btn soft" id="rerunBtn">✦ 重新评估</button>
</section>

<section class="card status-card">
  <div><div class="progress-label">评估完成度</div><div class="progress-num" id="progressNum"></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
  <div><div class="progress-label">评估阶段</div><div class="stage-row" id="stageRow"></div></div>
  <div class="status-side"><div class="mini-stat"><b id="taskCount"></b><span>已生成任务</span></div><div class="mini-stat"><b id="pendingCount"></b><span>待确认项</span></div><div class="mini-stat"><b id="riskCount"></b><span>未解决风险</span></div><div class="mini-stat"><b id="conflictCount">0</b><span>排期冲突</span></div></div>
</section>

<section class="card clarify">
  <div class="section-head"><div><div class="section-title">需要你确认</div><div class="section-sub">这些信息会影响 AI 的任务拆解、工作量或排期。确认后直接写回当前规划元数据。</div></div><div class="count-pill" id="clarifyCount"></div></div>
  <div class="clarify-grid" id="clarifyGrid"></div>
  <div class="clarify-actions"><button class="btn primary" id="applyClarifications">应用确认并更新评估</button></div>
</section>

<section class="workspace">
  <div class="card plan">
    <div class="plan-head">
      <div><div class="section-title">任务与排期</div><div class="section-sub">AI 生成的可执行方案，可直接人工修改负责人、人日与日期。</div></div>
      <div class="plan-meta"><span class="chip front" id="frontChip"></span><span class="chip back" id="backChip"></span><span class="chip other" id="otherChip"></span></div>
      <div class="plan-tools"><select id="groupSelect"><option value="category">按开发类型</option><option value="assignee">按负责人</option></select><label class="chip"><input type="checkbox" id="criticalToggle" checked/> 关键路径</label></div>
    </div>
    <div class="gantt-wrap"><div class="gantt" id="gantt"></div></div>
  </div>

  <aside class="card side">
    <div class="side-head"><b>AI 评估依据</b><span class="chip" id="confidenceChip"></span></div>
    <div id="detail"></div>
  </aside>
</section>
</main>

<footer class="footerbar"><div class="footer-inner">
  <div class="footer-summary"><span>预计 <b id="totalEffort"></b> 人日</span><span>周期 <b id="duration"></b> 工作日</span><span>预计交付 <b id="delivery"></b></span><span class="saved" id="savedState">✓ 已保存</span></div>
  <div class="footer-actions"><button class="btn" id="saveBtn">保存草稿</button><button class="btn primary" id="confirmBtn">确认评估</button></div>
</div></footer>
</div>

<script>
const initialData={
  schema_version:'2.0',
  requirement:{id:'REQ-2048',title:'活动报名功能',description:'支持用户查看活动详情、填写报名信息并提交；支持报名状态管理与数据查询。',priority:'medium',source:'product'},
  status:{stage:'human_review',completion_percent:80,pending_clarifications:3,unresolved_risks:1,conflicts:0},
  stages:[
    {id:'understanding',name:'需求理解',status:'done'},
    {id:'breakdown',name:'任务拆解',status:'done'},
    {id:'estimation',name:'工作量评估',status:'done'},
    {id:'scheduling',name:'排期生成',status:'done'},
    {id:'human_review',name:'人类确认',status:'pending'}
  ],
  summary:{total_effort_days:8,frontend_effort_days:3,backend_effort_days:4,other_effort_days:1,estimated_working_days:5,start_date:'2026-11-05',delivery_date:'2026-11-11',recommended_people:3,confidence:'medium',critical_path:['BE-01','FE-02','QA-01']},
  clarifications:[
    {id:'Q1',type:'single_select',question:'活动是否限制总报名人数？',required:true,ai_assumption:'不限制',value:null,options:['不限制','有限制'],impact_text:'若有限制，BE-01 可能增加并发控制与一致性处理。',related_task_ids:['BE-01']},
    {id:'Q2',type:'single_select',question:'是否允许同一用户重复报名？',required:true,ai_assumption:'不允许',value:null,options:['不允许','允许'],impact_text:'会影响报名接口校验逻辑与数据约束。',related_task_ids:['BE-01','BE-03']},
    {id:'Q3',type:'assignee_select',question:'联调验收由谁主责？',required:true,ai_assumption:'后端 A',value:null,options:['后端 A','后端 C','前端 B'],impact_text:'会影响 QA-01 的负责人和资源占用。',related_task_ids:['QA-01']}
  ],
  tasks:[
    {id:'FE-01',title:'活动详情页面',category:'frontend',description:'完成活动详情展示、报名入口和基础状态展示。',effort_days:1.5,confidence:'high',assignee:{id:'U-FE-01',name:'前端 B',role:'frontend'},start_date:'2026-11-05',end_date:'2026-11-06',dependencies:[],estimate_basis:['详情页结构约 0.5 人日','状态展示及交互约 0.5 人日','异常态与自测约 0.5 人日'],risks:[]},
    {id:'FE-02',title:'报名交互与接口接入',category:'frontend',description:'完成报名表单、校验、接口调用、加载态及异常反馈。',effort_days:1.5,confidence:'medium',assignee:{id:'U-FE-01',name:'前端 B',role:'frontend'},start_date:'2026-11-09',end_date:'2026-11-10',dependencies:['FE-01','BE-01'],estimate_basis:['表单与校验约 0.5 人日','接口接入约 0.5 人日','异常处理与自测约 0.5 人日'],risks:['接口字段若发生变化可能增加联调成本']},
    {id:'BE-01',title:'报名核心接口',category:'backend',description:'实现报名提交接口、参数校验、幂等及基础异常处理。',effort_days:2,confidence:'medium',assignee:{id:'U-BE-01',name:'后端 A',role:'backend'},start_date:'2026-11-05',end_date:'2026-11-06',dependencies:[],estimate_basis:['接口及领域逻辑约 1 人日','幂等与异常处理约 0.5 人日','单测与自测约 0.5 人日'],risks:['是否存在报名名额并发控制尚未明确']},
    {id:'BE-02',title:'活动状态管理',category:'backend',description:'补充活动报名状态及状态判断逻辑。',effort_days:1,confidence:'high',assignee:{id:'U-BE-02',name:'后端 C',role:'backend'},start_date:'2026-11-05',end_date:'2026-11-05',dependencies:[],estimate_basis:['状态模型及逻辑调整约 1 人日'],risks:[]},
    {id:'BE-03',title:'报名数据模型与查询',category:'backend',description:'增加报名记录模型及基础查询能力。',effort_days:1,confidence:'high',assignee:{id:'U-BE-02',name:'后端 C',role:'backend'},start_date:'2026-11-09',end_date:'2026-11-09',dependencies:['BE-01'],estimate_basis:['数据模型与 DAO 约 0.5 人日','查询能力约 0.5 人日'],risks:[]},
    {id:'QA-01',title:'联调与验收',category:'other',description:'完成前后端联调、主流程验证及异常场景检查。',effort_days:1,confidence:'medium',assignee:{id:'U-BE-01',name:'后端 A',role:'backend'},start_date:'2026-11-11',end_date:'2026-11-11',dependencies:['FE-02','BE-02','BE-03'],estimate_basis:['主流程联调约 0.5 人日','异常场景及验收约 0.5 人日'],risks:[]}
  ],
  risks:[{id:'R-01',level:'medium',title:'报名并发规则未明确',description:'如果存在活动名额限制，需要额外处理并发扣减和数据一致性。',related_task_ids:['BE-01'],resolved:false}],
  assumptions:['已有用户体系可以直接复用','不包含支付流程','不包含复杂审批流程'],
  revision:{version:1,last_modified_by:'ai',last_modified_at:'2026-11-04T14:00:00+08:00',changes:[]}
};
let data=JSON.parse(JSON.stringify(initialData));
let selectedTask='FE-02',groupMode='category',showCritical=true;
const days=['2026-11-05','2026-11-06','2026-11-09','2026-11-10','2026-11-11'];
const cats={frontend:'前端开发',backend:'后端开发',other:'联调验收'},typeName={frontend:'前端',backend:'后端',other:'其他'};
const fmt=d=>d.slice(5).replace('-','/'),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),q=s=>document.querySelector(s);

function recalc(){
  data.summary.frontend_effort_days=sum(data.tasks.filter(t=>t.category==='frontend'),t=>+t.effort_days);
  data.summary.backend_effort_days=sum(data.tasks.filter(t=>t.category==='backend'),t=>+t.effort_days);
  data.summary.other_effort_days=sum(data.tasks.filter(t=>t.category==='other'),t=>+t.effort_days);
  data.summary.total_effort_days=data.summary.frontend_effort_days+data.summary.backend_effort_days+data.summary.other_effort_days;
  const answered=data.clarifications.filter(x=>x.value!==null&&x.value!=='').length,total=data.clarifications.length;
  data.status.pending_clarifications=total-answered;
  data.status.completion_percent=Math.round(80+(answered/Math.max(1,total))*20);
  data.status.stage=answered===total?'ready':'human_review';
  data.stages.find(x=>x.id==='human_review').status=answered===total?'done':'pending';
  data.status.unresolved_risks=data.risks.filter(r=>!r.resolved).length;
}
function touch(change){data.revision.version++;data.revision.last_modified_by='human';data.revision.last_modified_at=new Date().toISOString();data.revision.changes.push(change);q('#savedState').classList.remove('show')}
function renderTop(){
  q('#reqTitle').textContent='【需求】'+data.requirement.title;q('#reqDesc').textContent=data.requirement.description;q('#reqId').textContent=data.requirement.id;q('#priorityTag').textContent='中优先级';
  q('#progressNum').textContent=data.status.completion_percent+'%';q('#progressFill').style.width=data.status.completion_percent+'%';
  q('#stageRow').innerHTML=data.stages.map(s=>'<div class="stage '+s.status+'"><span class="stage-dot">'+(s.status==='done'?'✓':'!')+'</span>'+s.name+'</div>').join('');
  q('#taskCount').textContent=data.tasks.length;q('#pendingCount').textContent=data.status.pending_clarifications;q('#riskCount').textContent=data.status.unresolved_risks;q('#conflictCount').textContent=data.status.conflicts;
  q('#clarifyCount').textContent=data.status.pending_clarifications?'待确认 '+data.status.pending_clarifications:'已全部确认';
  q('#frontChip').textContent='前端 '+data.summary.frontend_effort_days+' 人日';q('#backChip').textContent='后端 '+data.summary.backend_effort_days+' 人日';q('#otherChip').textContent='其他 '+data.summary.other_effort_days+' 人日';
  q('#totalEffort').textContent=data.summary.total_effort_days;q('#duration').textContent=data.summary.estimated_working_days;q('#delivery').textContent=fmt(data.summary.delivery_date);
  q('#confirmBtn').disabled=data.status.pending_clarifications>0;
}
function renderClarifications(){
  q('#clarifyGrid').innerHTML=data.clarifications.map(c=>{
    const done=c.value!==null&&c.value!=='';
    const control=c.type==='assignee_select'
      ? '<select data-q="'+c.id+'"><option value="">请选择</option>'+c.options.map(o=>'<option '+(c.value===o?'selected':'')+'>'+o+'</option>').join('')+'</select>'
      : '<div class="radio-group">'+c.options.map(o=>'<div class="radio-chip '+(c.value===o?'active':'')+'" data-q="'+c.id+'" data-v="'+o+'">'+o+'</div>').join('')+'</div>';
    return '<div class="qcard '+(done?'done':'')+'"><div class="qtop"><div class="qtitle">'+c.question+'</div><div class="qmeta">AI 假设：'+c.ai_assumption+'</div></div><div class="qdesc">'+c.impact_text+'</div><div class="control">'+control+'</div><div class="impact">影响任务：'+c.related_task_ids.join('、')+'</div></div>'
  }).join('');
  document.querySelectorAll('.radio-chip').forEach(el=>el.onclick=()=>{const c=data.clarifications.find(x=>x.id===el.dataset.q);c.value=el.dataset.v;touch('clarification:'+c.id+'='+c.value);recalc();renderAll()});
  document.querySelectorAll('.qcard select').forEach(el=>el.onchange=()=>{const c=data.clarifications.find(x=>x.id===el.dataset.q);c.value=el.value||null;touch('clarification:'+c.id+'='+c.value);recalc();renderAll()});
}
function groupData(){
  if(groupMode==='category')return ['frontend','backend','other'].map(k=>({label:cats[k],tasks:data.tasks.filter(t=>t.category===k)})).filter(g=>g.tasks.length);
  const m={};data.tasks.forEach(t=>{m[t.assignee.name]??=[];m[t.assignee.name].push(t)});return Object.entries(m).map(([label,tasks])=>({label,tasks}));
}
function assigneeOptions(t){return ['前端 B','后端 A','后端 C'].map(n=>'<option '+(n===t.assignee.name?'selected':'')+'>'+n+'</option>').join('')}
function renderGantt(){
  let h='<div class="g-head"><div>任务 / 工作项</div><div>负责人</div><div>人日</div><div>开始</div><div>结束</div>'+days.map(d=>'<div>'+fmt(d)+'</div>').join('')+'</div>';
  groupData().forEach(g=>{h+='<div class="group-row"><div class="group-label">⌄ '+g.label+' · '+g.tasks.length+' 项 / '+sum(g.tasks,t=>+t.effort_days)+' 人日</div><div class="group-fill"></div></div>';
    g.tasks.forEach(t=>{const critical=data.summary.critical_path.includes(t.id);h+='<div class="task-row '+(selectedTask===t.id?'selected':'')+'" data-task="'+t.id+'"><div class="cell task-cell"><span class="task-id">'+t.id+'</span><span>'+t.title+'</span></div><div class="cell"><select class="editable assignee" data-task="'+t.id+'">'+assigneeOptions(t)+'</select></div><div class="cell"><input class="editable num effort" data-task="'+t.id+'" type="number" min=".5" step=".5" value="'+t.effort_days+'"></div><div class="cell"><input class="editable start" data-task="'+t.id+'" type="date" value="'+t.start_date+'"></div><div class="cell"><input class="editable end" data-task="'+t.id+'" type="date" value="'+t.end_date+'"></div>';
      days.forEach(d=>{h+='<div class="day">';if(d===t.start_date){const s=days.indexOf(t.start_date),e=days.indexOf(t.end_date),span=Math.max(1,e-s+1);h+='<div class="bar '+t.category+' '+(showCritical&&critical?'critical':'')+'" style="width:calc('+span+'00% - 14px)">'+t.id+' · '+t.effort_days+'d</div>'}h+='</div>'});h+='</div>'});
  });
  q('#gantt').innerHTML=h;
  document.querySelectorAll('.task-row').forEach(r=>r.onclick=e=>{if(['INPUT','SELECT','OPTION'].includes(e.target.tagName))return;selectedTask=r.dataset.task;renderGantt();renderDetail()});
  document.querySelectorAll('.assignee').forEach(el=>el.onchange=()=>{const t=data.tasks.find(x=>x.id===el.dataset.task);t.assignee.name=el.value;touch('assignee:'+t.id+'='+el.value);renderAll()});
  document.querySelectorAll('.effort').forEach(el=>el.onchange=()=>{const t=data.tasks.find(x=>x.id===el.dataset.task);const v=Math.max(.5,+el.value||.5);t.effort_days=v;touch('effort:'+t.id+'='+v);recalc();renderAll()});
  document.querySelectorAll('.start').forEach(el=>el.onchange=()=>{const t=data.tasks.find(x=>x.id===el.dataset.task);t.start_date=el.value;touch('start:'+t.id+'='+el.value);renderAll()});
  document.querySelectorAll('.end').forEach(el=>el.onchange=()=>{const t=data.tasks.find(x=>x.id===el.dataset.task);t.end_date=el.value;touch('end:'+t.id+'='+el.value);renderAll()});
}
function renderDetail(){
  const t=data.tasks.find(x=>x.id===selectedTask);const conf={high:'高',medium:'中',low:'低'}[t.confidence]||t.confidence;
  q('#confidenceChip').textContent='置信度 '+conf;
  q('#detail').innerHTML='<div class="side-body"><span class="chip '+(t.category==='frontend'?'front':t.category==='backend'?'back':'other')+'">'+typeName[t.category]+'</span><div class="side-title">'+t.id+' · '+t.title+'</div><div class="kv"><div class="k">负责人</div><div>'+t.assignee.name+'</div></div><div class="kv"><div class="k">工作量</div><div><b>'+t.effort_days+' 人日</b></div></div><div class="kv"><div class="k">计划时间</div><div>'+fmt(t.start_date)+' → '+fmt(t.end_date)+'</div></div><div class="kv"><div class="k">前置依赖</div><div>'+(t.dependencies.join('、')||'无')+'</div></div><div class="detail-sec"><h3>任务说明</h3><p>'+t.description+'</p></div><div class="detail-sec"><h3>AI 估算依据</h3><ul>'+t.estimate_basis.map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="riskbox">⚠ 风险提示<br>'+(t.risks.join('；')||'暂无明显风险')+'</div></div>'
}
function renderAll(){recalc();renderTop();renderClarifications();renderGantt();renderDetail()}
q('#groupSelect').onchange=e=>{groupMode=e.target.value;renderGantt()};q('#criticalToggle').onchange=e=>{showCritical=e.target.checked;renderGantt()};
q('#applyClarifications').onclick=()=>{const q3=data.clarifications.find(x=>x.id==='Q3');if(q3.value){data.tasks.find(t=>t.id==='QA-01').assignee.name=q3.value}touch('apply_clarifications');renderAll()};
q('#saveBtn').onclick=()=>{q('#savedState').classList.add('show');setTimeout(()=>q('#savedState').classList.remove('show'),1800)};
q('#confirmBtn').onclick=()=>{if(data.status.pending_clarifications)return;data.status.stage='confirmed';touch('confirm_plan');q('#confirmBtn').textContent='已确认';q('#confirmBtn').disabled=true;q('#savedState').textContent='✓ 已确认';q('#savedState').classList.add('show')};
q('#rerunBtn').onclick=()=>{data=JSON.parse(JSON.stringify(initialData));selectedTask='FE-02';groupMode='category';showCritical=true;q('#groupSelect').value='category';q('#criticalToggle').checked=true;q('#confirmBtn').textContent='确认评估';renderAll()};
renderAll();
</script>
</body></html>
