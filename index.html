<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>xdpai · 需求智能评估</title>
<style>
:root{--bg:#f6f7fb;--line:#e7e9f1;--text:#182033;--muted:#707787;--purple:#6557e6;--purpleSoft:#f1efff;--green:#2f9d68;--greenSoft:#eaf7f0;--blue:#4b78e6;--blueSoft:#edf2ff;--amber:#c88c34;--amberSoft:#fff5df;--shadow:0 8px 24px rgba(28,37,64,.055);--r:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}.topbar{height:58px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}.brand{display:flex;gap:10px;align-items:center;font-weight:800}.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--purple),#988aff);color:#fff;display:grid;place-items:center}.wrap{max-width:1640px;margin:auto;padding:18px 20px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.hero{padding:19px 22px;display:flex;justify-content:space-between;gap:16px}.hero h1{font-size:22px;margin:0}.hero p{margin:7px 0 0;color:var(--muted);font-size:13px}.tags{display:flex;gap:7px;margin-top:10px}.tag,.chip{font-size:11px;padding:4px 8px;border-radius:999px;background:#f1f2f6;color:#5f6675}.purple{background:var(--purpleSoft);color:var(--purple)}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.flow{margin-top:12px;padding:12px 16px;display:flex;align-items:center;gap:14px}.progress{width:150px}.progress-line{display:flex;align-items:center;gap:8px}.progress-num{font-size:20px;font-weight:850}.track{height:6px;background:#eceef4;border-radius:99px;overflow:hidden;flex:1}.fill{height:100%;background:linear-gradient(90deg,var(--purple),#9487f7)}.stages{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.stage{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:9px;font-size:11px;background:#f5f6f9;cursor:pointer;border:1px solid transparent}.stage.completed{background:var(--greenSoft);color:var(--green)}.stage.stale{background:var(--amberSoft);color:#94691f}.stage.active{border-color:#bdb5ff;background:var(--purpleSoft);color:var(--purple);font-weight:800}.dot{width:15px;height:15px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:9px}.arrow{color:#c4c8d1}.main{margin-top:12px;overflow:hidden}.main-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.main-title{font-size:16px;font-weight:800}.main-sub{font-size:11px;color:var(--muted);margin-top:4px}.main-body{padding:16px 18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.info{border:1px solid var(--line);border-radius:12px;padding:13px}.info h3,.section h3,.module-head h3{font-size:12px;margin:0 0 7px}.info p,.info li{font-size:11px;color:#596071;line-height:1.6}.info ul{margin:0;padding-left:17px}.section{margin-top:16px}.module-block{margin-top:14px}.module-table,.task-table{width:100%;border-collapse:collapse;font-size:11px}.module-table th,.module-table td,.task-table th,.task-table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}.module-table th,.task-table th{background:#fafbfe;color:#687080}.module-table input,.task-table input,.task-table select,.inline-edit{width:100%;border:1px solid transparent;background:transparent;border-radius:7px;padding:6px}.module-table input:hover,.module-table input:focus,.task-table input:hover,.task-table input:focus,.task-table select:hover,.task-table select:focus,.inline-edit:hover,.inline-edit:focus{border-color:#c8c2fa;background:#fff;outline:none}.icon-btn{border:0;background:transparent;color:#8a91a0;cursor:pointer}.qrow{display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,1.15fr);gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}.qtitle{font-size:12px;font-weight:750}.qhint{font-size:10px;color:var(--muted);margin-top:4px}.choice{display:flex;gap:7px;flex-wrap:wrap}.choice button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11px;cursor:pointer}.choice button.active{background:var(--purpleSoft);color:var(--purple);border-color:#beb7ff}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px}.textarea{min-height:68px}.task-id{font-size:9px;background:#f1f2f6;padding:2px 5px;border-radius:5px}.type{font-size:10px;padding:3px 7px;border-radius:999px}.frontend{background:var(--greenSoft);color:var(--green)}.backend{background:var(--blueSoft);color:var(--blue)}.other{background:var(--amberSoft);color:var(--amber)}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.metric{border:1px solid var(--line);border-radius:12px;padding:13px}.metric b{display:block;font-size:20px}.metric span{font-size:10px;color:var(--muted)}.gantt-wrap{overflow:auto}.gantt{min-width:1080px}.ghead,.grow,.ggroup{display:grid;grid-template-columns:270px 110px 72px 92px 92px repeat(var(--days),minmax(78px,1fr))}.ghead{background:#fafbfe;font-size:10px;color:#687080;font-weight:700}.ghead>div,.gcell,.gday{padding:9px 8px;border-right:1px solid #eef0f5;border-bottom:1px solid #eef0f5}.ggroup{background:#fcfcff;font-size:11px;font-weight:750}.ggroup>div:first-child{grid-column:1/6;padding:9px 10px;border-bottom:1px solid var(--line)}.ggroup>div:last-child{grid-column:6/-1;border-bottom:1px solid var(--line)}.grow{min-height:54px;font-size:11px}.gday{position:relative;padding:0}.bar{position:absolute;left:6px;top:14px;height:24px;border-radius:7px;color:#fff;padding:0 8px;display:flex;align-items:center;font-size:9px;font-weight:800;white-space:nowrap}.bar.frontend{background:#42ad76}.bar.backend{background:#577fdf}.bar.other{background:#d39a43}.bar.critical{outline:2px solid rgba(101,87,230,.35);outline-offset:2px}.footerbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line)}.footer-inner{max-width:1640px;margin:auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}.footer-meta{display:flex;gap:18px;font-size:11px;color:#5e6574}.error{margin-top:12px;padding:14px;color:#a5483d;background:#fff0ec;border:1px solid #f0c9c1;border-radius:12px;display:none}
@media(max-width:800px){.grid3,.metric-grid{grid-template-columns:1fr}.qrow{grid-template-columns:1fr}.hero{flex-direction:column}.flow{align-items:flex-start;flex-direction:column}.footerbar{position:static}}
</style></head><body>
<header class="topbar"><div class="brand"><div class="logo">✦</div><div>xdpai</div><div>需求智能评估</div></div><div style="font-size:12px;color:var(--muted)">研发小组</div></header>
<main class="wrap">
<section class="card hero"><div><h1 id="title">加载中...</h1><p id="desc"></p><div class="tags"><span class="tag purple">AI 评估草案</span><span class="tag" id="reqId"></span><span class="tag" id="priority"></span><span class="tag" id="pendingTag"></span></div></div><button class="btn" onclick="location.reload()">重新加载</button></section>
<div class="error" id="error"></div>
<section class="card flow"><div class="progress"><div style="font-size:10px;color:var(--muted)">阶段生成</div><div class="progress-line"><div class="progress-num" id="progressNum">0/4</div><div class="track"><div class="fill" id="progressFill"></div></div></div></div><div class="stages" id="stages"></div></section>
<section class="card main"><div class="main-head"><div><div class="main-title" id="stageTitle"></div><div class="main-sub" id="stageSub"></div></div><div id="stageBadge"></div></div><div class="main-body" id="stageBody"></div></section>
</main>
<footer class="footerbar"><div class="footer-inner"><div class="footer-meta"><span>总工作量 <b id="totalEffort">—</b> 人日</span><span>周期 <b id="duration">—</b> 工作日</span><span>预计交付 <b id="delivery">—</b></span><span id="saveState"></span></div><div><button class="btn" id="save">保存当前修改</button> <button class="btn primary" id="confirm">确认评估</button></div></div></footer>
<script>
let initData,understanding,breakdown,estimation,scheduling,active='understanding',showCritical=true;
const $=s=>document.querySelector(s),typeName={frontend:'前端',backend:'后端',other:'其他'},fmt=d=>d?d.slice(5).replace('-','/'):'—';
async function load(){
 try{
  [initData,understanding,breakdown,estimation,scheduling]=await Promise.all(['init.json','understanding.json','breakdown.json','estimation.json','scheduling.json'].map(x=>fetch(x).then(r=>{if(!r.ok)throw new Error(x+' '+r.status);return r.json()})));
  renderShell();render();
 }catch(e){$('#error').style.display='block';$('#error').textContent='数据加载失败：'+e.message+'。请通过 HTTP Server 运行页面。'}
}
function renderShell(){const r=initData.requirement;$('#title').textContent='【需求】'+r.title;$('#desc').textContent=understanding.goal||r.description;$('#reqId').textContent=r.id;$('#priority').textContent=r.priority;const pending=understanding.review_items.filter(x=>x.required&&!x.value).length;$('#pendingTag').textContent=pending?pending+' 项待确认':'需求已确认';$('#totalEffort').textContent=estimation.summary.total_effort_days;$('#duration').textContent=scheduling.summary.estimated_working_days;$('#delivery').textContent=fmt(scheduling.summary.delivery_date);renderStages()}
function renderStages(){const order=[['understanding','需求理解'],['breakdown','任务拆解'],['estimation','工作量评估'],['scheduling','排期生成']];const completed=order.filter(([id])=>initData.stage_status[id]==='completed').length;const p=Math.round(completed/order.length*100);$('#progressNum').textContent=completed+'/'+order.length;$('#progressFill').style.width=p+'%';$('#stages').innerHTML=order.map(([id,name],i)=>'<div class="stage '+initData.stage_status[id]+' '+(active===id?'active':'')+'" data-stage="'+id+'"><span class="dot">'+(initData.stage_status[id]==='completed'?'✓':'!')+'</span>'+name+'</div>'+(i<order.length-1?'<span class="arrow">→</span>':'')).join('');document.querySelectorAll('[data-stage]').forEach(x=>x.onclick=()=>{active=x.dataset.stage;render()})}
function reviewForm(){return '<div class="section"><h3>待确认</h3>'+understanding.review_items.map(c=>{let control='';if(c.type==='choice'){control='<div class="choice">'+[...c.options,'自定义'].map(o=>'<button data-q="'+c.id+'" data-v="'+o+'" class="'+(c.value===o?'active':'')+'">'+o+'</button>').join('')+'</div>'+(c.value==='自定义'?'<input class="input" data-custom="'+c.id+'" style="margin-top:7px" value="'+(c.custom_value||'')+'" placeholder="请输入自定义答案">':'')}else control='<textarea class="textarea" data-text="'+c.id+'">'+(c.value||'')+'</textarea>';return '<div class="qrow"><div><div class="qtitle">'+c.question+'</div><div class="qhint">AI：'+c.ai_assumption+' · '+c.impact+'</div></div><div>'+control+'</div></div>'}).join('')+'</div>'}
function moduleTable(side){const ms=understanding.modules.filter(m=>m.side===side);return '<table class="module-table"><thead><tr><th>模块名</th><th>仓库</th><th>主要改动</th><th></th></tr></thead><tbody>'+ms.map(m=>'<tr><td><input data-mid="'+m.id+'" data-mf="name" value="'+m.name+'"></td><td><input data-mid="'+m.id+'" data-mf="repository" value="'+m.repository+'"></td><td><input data-mid="'+m.id+'" data-mf="change_summary" value="'+m.change_summary+'"></td><td><button class="icon-btn" data-del-module="'+m.id+'">删除</button></td></tr>').join('')+'</tbody></table><button class="btn" style="margin-top:8px" data-add-module="'+side+'">+ 添加模块</button>'}
function bindUnderstanding(){document.querySelectorAll('[data-mid]').forEach(i=>i.onchange=()=>understanding.modules.find(m=>m.id===i.dataset.mid)[i.dataset.mf]=i.value);document.querySelectorAll('[data-del-module]').forEach(b=>b.onclick=()=>{understanding.modules=understanding.modules.filter(m=>m.id!==b.dataset.delModule);renderUnderstanding()});document.querySelectorAll('[data-add-module]').forEach(b=>b.onclick=()=>{understanding.modules.push({id:'M'+Date.now(),side:b.dataset.addModule,name:'新模块',repository:'',change_summary:''});renderUnderstanding()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=understanding.review_items.find(x=>x.id===b.dataset.q);q.value=b.dataset.v;renderUnderstanding()});document.querySelectorAll('[data-custom]').forEach(i=>i.onchange=()=>understanding.review_items.find(x=>x.id===i.dataset.custom).custom_value=i.value);document.querySelectorAll('[data-text]').forEach(i=>i.onchange=()=>understanding.review_items.find(x=>x.id===i.dataset.text).value=i.value)}
function renderUnderstanding(){$('#stageTitle').textContent='需求理解';$('#stageSub').textContent='确认目标、范围、涉及模块和业务假设。';const pending=understanding.review_items.filter(x=>x.required&&!x.value).length;$('#stageBadge').innerHTML='<span class="chip purple">understanding.json · '+pending+' 项待确认</span>';$('#stageBody').innerHTML='<div class="grid3"><div class="info"><h3>目标</h3><p>'+understanding.goal+'</p></div><div class="info"><h3>涉及范围</h3><ul>'+understanding.scope.map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="info"><h3>不在范围</h3><ul>'+understanding.out_of_scope.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div><div class="module-block"><div class="module-head"><h3>前端模块</h3></div>'+moduleTable('frontend')+'</div><div class="module-block"><div class="module-head"><h3>后端模块</h3></div>'+moduleTable('backend')+'</div>'+reviewForm();bindUnderstanding()}
function renderBreakdown(){$('#stageTitle').textContent='任务拆解';$('#stageSub').textContent='任务定义独立存储，通过 module_id 关联需求理解。';$('#stageBadge').innerHTML='<span class="chip purple">breakdown.json · '+breakdown.tasks.length+' 项</span>';$('#stageBody').innerHTML='<table class="task-table"><thead><tr><th>任务</th><th>模块</th><th>类型</th><th>说明</th><th>依赖</th><th></th></tr></thead><tbody>'+breakdown.tasks.map(t=>'<tr><td><input data-tid="'+t.id+'" data-tf="title" value="'+t.title+'"></td><td><select data-tid="'+t.id+'" data-tf="module_id"><option value="">—</option>'+understanding.modules.map(m=>'<option value="'+m.id+'" '+(m.id===t.module_id?'selected':'')+'>'+m.name+'</option>').join('')+'</select></td><td><select data-tid="'+t.id+'" data-tf="category">'+['frontend','backend','other'].map(c=>'<option value="'+c+'" '+(c===t.category?'selected':'')+'>'+typeName[c]+'</option>').join('')+'</select></td><td><input data-tid="'+t.id+'" data-tf="description" value="'+t.description+'"></td><td><input data-tid="'+t.id+'" data-tf="dependencies" value="'+t.dependencies.join(',')+'"></td><td><button class="icon-btn" data-del-task="'+t.id+'">删除</button></td></tr>').join('')+'</tbody></table><button class="btn" style="margin-top:10px" id="addTask">+ 新增任务</button>';document.querySelectorAll('[data-tid]').forEach(i=>i.onchange=()=>{const t=breakdown.tasks.find(x=>x.id===i.dataset.tid);if(i.dataset.tf==='dependencies')t.dependencies=i.value.split(',').map(x=>x.trim()).filter(Boolean);else if(i.dataset.tf==='module_id')t.module_id=i.value||null;else t[i.dataset.tf]=i.value});document.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=()=>{breakdown.tasks=breakdown.tasks.filter(t=>t.id!==b.dataset.delTask);renderBreakdown()});$('#addTask').onclick=()=>{const id='T-'+String(breakdown.tasks.length+1).padStart(2,'0');breakdown.tasks.push({id,module_id:null,title:'新任务',category:'backend',description:'',dependencies:[]});renderBreakdown()}}
function taskById(id){return breakdown.tasks.find(t=>t.id===id)||{id,title:id,category:'other'}}
function recalcEst(){estimation.summary.total_effort_days=estimation.estimations.reduce((s,e)=>s+Number(e.effort_days||0),0);estimation.summary.confidence_counts={high:0,medium:0,low:0};estimation.estimations.forEach(e=>estimation.summary.confidence_counts[e.confidence]++)}
function renderEstimation(){recalcEst();$('#stageTitle').textContent='工作量评估';$('#stageSub').textContent='只维护 task_id 对应的人日、置信度与估算依据。';$('#stageBadge').innerHTML='<span class="chip purple">estimation.json · '+estimation.summary.total_effort_days+' 人日</span>';$('#stageBody').innerHTML='<div class="metric-grid"><div class="metric"><b>'+estimation.summary.total_effort_days+'</b><span>总人日</span></div><div class="metric"><b>'+estimation.summary.confidence_counts.medium+'</b><span>中置信度</span></div><div class="metric"><b>'+estimation.summary.confidence_counts.high+'</b><span>高置信度</span></div></div><table class="task-table"><thead><tr><th>任务</th><th>人日</th><th>置信度</th><th>估算依据</th><th>不确定因素</th></tr></thead><tbody>'+estimation.estimations.map(e=>{const t=taskById(e.task_id);return '<tr><td><span class="task-id">'+e.task_id+'</span> '+t.title+'</td><td><input class="inline-edit" type="number" step=".5" min=".5" data-eid="'+e.task_id+'" data-ef="effort_days" value="'+e.effort_days+'"></td><td><select class="inline-edit" data-eid="'+e.task_id+'" data-ef="confidence">'+['high','medium','low'].map(c=>'<option '+(c===e.confidence?'selected':'')+'>'+c+'</option>').join('')+'</select></td><td><input class="inline-edit" data-eid="'+e.task_id+'" data-ef="basis" value="'+e.estimate_basis.map(b=>b.item+' '+b.effort_days+'d').join('；')+'"></td><td>'+e.uncertainties.join('；')+'</td></tr>'}).join('')+'</tbody></table>';document.querySelectorAll('[data-eid]').forEach(i=>i.onchange=()=>{const e=estimation.estimations.find(x=>x.task_id===i.dataset.eid);if(i.dataset.ef==='effort_days'){e.effort_days=Number(i.value);if(e.estimate_basis.length===1)e.estimate_basis[0].effort_days=e.effort_days}else if(i.dataset.ef==='confidence')e.confidence=i.value;else if(i.dataset.ef==='basis'){e.estimate_basis=i.value.split('；').filter(Boolean).map((x,idx)=>({item:x.replace(/\s+\d+(\.\d+)?d$/,''),effort_days:idx===0?e.effort_days:0}))}renderEstimation();renderShell()})}
function workdays(start,end){const out=[],d=new Date(start+'T00:00:00');const e=new Date(end+'T00:00:00');while(d<=e){if(d.getDay()!=0&&d.getDay()!=6)out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}return out}
function renderScheduling(){const days=workdays(scheduling.summary.start_date,scheduling.summary.delivery_date);document.documentElement.style.setProperty('--days',days.length);$('#stageTitle').textContent='排期生成';$('#stageSub').textContent='只维护 task_id 对应的负责人和时间安排。';$('#stageBadge').innerHTML='<label class="chip"><input id="critical" type="checkbox" '+(showCritical?'checked':'')+'> 关键路径</label>';let h='<div class="gantt-wrap"><div class="gantt"><div class="ghead"><div>任务</div><div>负责人</div><div>人日</div><div>开始</div><div>结束</div>'+days.map(d=>'<div>'+fmt(d)+'</div>').join('')+'</div>';['frontend','backend','other'].forEach(c=>{const rows=scheduling.schedule.filter(s=>taskById(s.task_id).category===c);h+='<div class="ggroup"><div>'+typeName[c]+' · '+rows.length+' 项</div><div></div></div>';rows.forEach(s=>{const t=taskById(s.task_id),e=estimation.estimations.find(x=>x.task_id===s.task_id);h+='<div class="grow"><div class="gcell"><span class="task-id">'+s.task_id+'</span> '+t.title+'</div><div class="gcell"><input class="inline-edit" data-sid="'+s.task_id+'" data-sf="assignee" value="'+s.assignee+'"></div><div class="gcell">'+(e?e.effort_days:'—')+'</div><div class="gcell"><input class="inline-edit" type="date" data-sid="'+s.task_id+'" data-sf="start_date" value="'+s.start_date+'"></div><div class="gcell"><input class="inline-edit" type="date" data-sid="'+s.task_id+'" data-sf="end_date" value="'+s.end_date+'"></div>';days.forEach(d=>{h+='<div class="gday">';if(d===s.start_date){const span=Math.max(1,days.indexOf(s.end_date)-days.indexOf(s.start_date)+1);h+='<div class="bar '+t.category+' '+(showCritical&&scheduling.summary.critical_path.includes(s.task_id)?'critical':'')+'" style="width:calc('+span+'00% - 12px)">'+s.task_id+'</div>'}h+='</div>'});h+='</div>'})});h+='</div></div>';$('#stageBody').innerHTML=h;$('#critical').onchange=e=>{showCritical=e.target.checked;renderScheduling()};document.querySelectorAll('[data-sid]').forEach(i=>i.onchange=()=>{scheduling.schedule.find(x=>x.task_id===i.dataset.sid)[i.dataset.sf]=i.value;const starts=scheduling.schedule.map(x=>x.start_date).sort(),ends=scheduling.schedule.map(x=>x.end_date).sort();scheduling.summary.start_date=starts[0];scheduling.summary.delivery_date=ends[ends.length-1];scheduling.summary.estimated_working_days=workdays(starts[0],ends[ends.length-1]).length;renderScheduling();renderShell()})}
function render(){renderStages();if(active==='understanding')renderUnderstanding();else if(active==='breakdown')renderBreakdown();else if(active==='estimation')renderEstimation();else renderScheduling()}
$('#save').onclick=()=>{$('#saveState').textContent='✓ 当前页面状态已保存到内存';setTimeout(()=>$('#saveState').textContent='',1600)};$('#confirm').onclick=()=>{$('#confirm').textContent='已确认';$('#confirm').disabled=true};load();
</script></body></html>
