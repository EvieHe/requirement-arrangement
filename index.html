<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>xdpai · 需求智能评估</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--line:#e7e9f1;--text:#182033;--muted:#707787;--purple:#6557e6;--purpleSoft:#f1efff;--green:#2f9d68;--greenSoft:#eaf7f0;--blue:#4b78e6;--blueSoft:#edf2ff;--amber:#c88c34;--amberSoft:#fff5df;--shadow:0 8px 24px rgba(28,37,64,.055);--r:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}.topbar{height:58px;padding:0 28px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--purple),#988aff);color:#fff;display:grid;place-items:center}.muted{color:var(--muted)}.wrap{max-width:1640px;margin:auto;padding:18px 20px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hero{padding:19px 22px;display:flex;justify-content:space-between;gap:16px}.hero h1{font-size:22px;margin:0}.hero p{margin:7px 0 0;font-size:13px;line-height:1.6;color:var(--muted)}.tags{display:flex;gap:7px;margin-top:10px}.tag,.chip{font-size:11px;padding:4px 8px;border-radius:999px;background:#f1f2f6;color:#5f6675}.tag.purple,.chip.purple{background:var(--purpleSoft);color:var(--purple)}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;color:#394050}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.btn.soft{background:var(--purpleSoft);border-color:transparent;color:var(--purple);font-weight:700}.btn:disabled{opacity:.45;cursor:not-allowed}
.flow{margin-top:12px;padding:12px 16px;display:flex;align-items:center;gap:14px}.progress{width:150px}.progress-line{display:flex;align-items:center;gap:8px}.progress-num{font-weight:850;font-size:20px}.track{height:6px;background:#eceef4;border-radius:99px;overflow:hidden;flex:1}.fill{height:100%;background:linear-gradient(90deg,var(--purple),#9487f7);border-radius:99px}.stages{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.stage{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:9px;font-size:11px;color:#606776;background:#f5f6f9;cursor:pointer;border:1px solid transparent}.stage.done{background:var(--greenSoft);color:var(--green)}.stage.pending{background:var(--amberSoft);color:#94691f}.stage.active{border-color:#bdb5ff;background:var(--purpleSoft);color:var(--purple);font-weight:800}.dot{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;font-size:9px}.arrow{color:#c4c8d1}
.content{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;margin-top:12px;align-items:start}.main{overflow:hidden}.main-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.main-title{font-weight:800;font-size:16px}.main-sub{font-size:11px;color:var(--muted);margin-top:4px}.main-body{padding:16px 18px}.side{position:sticky;top:70px;overflow:hidden}.side-head{padding:15px 17px;border-bottom:1px solid var(--line);font-size:13px;font-weight:800}.side-body{padding:15px 17px;max-height:calc(100vh - 140px);overflow:auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.info{border:1px solid var(--line);border-radius:12px;padding:13px}.info h3{margin:0 0 6px;font-size:12px}.info p,.info li{font-size:11px;color:#596071;line-height:1.6}.info ul{margin:0;padding-left:17px}.section{margin-top:14px}.section:first-child{margin-top:0}.section h3{font-size:12px;margin:0 0 8px}.list{border-top:1px solid var(--line)}.row{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:160px 1fr;gap:18px;align-items:start}.label{font-size:12px;font-weight:700}.value{font-size:12px;color:#596071;line-height:1.6}
.qrow{display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,1.15fr);gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}.qtitle{font-size:12px;font-weight:750}.qhint{font-size:10px;color:var(--muted);margin-top:4px}.choice{display:flex;gap:7px;flex-wrap:wrap}.choice button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11px;cursor:pointer}.choice button.active{background:var(--purpleSoft);color:var(--purple);border-color:#beb7ff}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:#394050;font-size:11px}.textarea{min-height:68px;resize:vertical}
.task-table{width:100%;border-collapse:collapse;font-size:11px}.task-table th,.task-table td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left}.task-table th{background:#fafbfe;color:#687080}.task-table tr:hover td{background:#fbfbff}.task-id{font-size:9px;background:#f1f2f6;padding:2px 5px;border-radius:5px;color:#858b98}.type{font-size:10px;padding:3px 7px;border-radius:999px}.type.frontend{background:var(--greenSoft);color:var(--green)}.type.backend{background:var(--blueSoft);color:var(--blue)}.type.other{background:var(--amberSoft);color:var(--amber)}.inline-edit{width:100%;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px}.inline-edit:hover,.inline-edit:focus{border-color:#c8c2fa;background:#fff;outline:none}
.gantt-wrap{overflow:auto}.gantt{min-width:1080px}.ghead,.grow,.ggroup{display:grid;grid-template-columns:270px 100px 70px 88px 88px repeat(5,minmax(80px,1fr))}.ghead{background:#fafbfe;font-size:10px;color:#687080;font-weight:700}.ghead>div,.gcell,.gday{padding:9px 8px;border-right:1px solid #eef0f5;border-bottom:1px solid #eef0f5}.ggroup{background:#fcfcff;font-size:11px;font-weight:750}.ggroup>div:first-child{grid-column:1/6;padding:9px 10px;border-bottom:1px solid var(--line)}.ggroup>div:last-child{grid-column:6/11;border-bottom:1px solid var(--line)}.grow{min-height:54px;font-size:11px;cursor:pointer}.grow.selected{background:#f8f7ff}.gday{position:relative;padding:0}.bar{position:absolute;left:6px;top:14px;height:24px;border-radius:7px;color:#fff;padding:0 8px;display:flex;align-items:center;font-size:9px;font-weight:800;white-space:nowrap}.bar.frontend{background:#42ad76}.bar.backend{background:#577fdf}.bar.other{background:#d39a43}.bar.critical{outline:2px solid rgba(101,87,230,.35);outline-offset:2px}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.metric{border:1px solid var(--line);border-radius:12px;padding:13px}.metric b{display:block;font-size:20px}.metric span{font-size:10px;color:var(--muted)}.basis{border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px}.basis b{font-size:11px;display:block;margin-bottom:5px}.basis p{font-size:10px;color:#5e6574;line-height:1.55;margin:0}.risk{background:var(--amberSoft);color:#8b651f;border-radius:10px;padding:10px;font-size:10px;line-height:1.55}.side h3{font-size:12px;margin:15px 0 7px}.side p,.side li{font-size:10px;color:#5b6271;line-height:1.6}.side ul{padding-left:17px;margin:6px 0}
.footerbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);z-index:25}.footer-inner{max-width:1640px;margin:auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}.footer-meta{display:flex;gap:18px;font-size:11px;color:#5e6574}.footer-meta b{color:var(--text)}.actions{display:flex;gap:8px}
@media(max-width:1050px){.content{grid-template-columns:1fr}.side{position:static}.grid3,.metric-grid{grid-template-columns:1fr 1fr}.qrow{grid-template-columns:1fr}}
@media(max-width:700px){.wrap{padding:12px 12px 20px}.flow{align-items:flex-start;flex-direction:column}.grid3,.metric-grid{grid-template-columns:1fr}.footerbar{position:static}.footer-inner{flex-direction:column;align-items:flex-start}.hero{flex-direction:column}.topbar{padding:0 14px}.stages{overflow:auto;flex-wrap:nowrap;width:100%}}
</style></head>
<body>
<header class="topbar"><div class="brand"><div class="logo">✦</div><div>xdpai</div><div>需求智能评估</div></div><div class="muted" style="font-size:12px">研发小组</div></header>
<main class="wrap">
<section class="card hero"><div><h1>【需求】活动报名功能</h1><p>支持用户查看活动详情、填写报名信息并提交；支持报名状态管理与数据查询。</p><div class="tags"><span class="tag purple">AI 评估草案</span><span class="tag">REQ-2048</span><span class="tag">中优先级</span></div></div><button class="btn soft" id="rerun">✦ 重新评估</button></section>
<section class="card flow"><div class="progress"><div class="muted" style="font-size:10px">评估进度</div><div class="progress-line"><div class="progress-num" id="progressNum">80%</div><div class="track"><div class="fill" id="progressFill" style="width:80%"></div></div></div></div><div class="stages" id="stages"></div></section>
<section class="content"><div class="card main"><div class="main-head"><div><div class="main-title" id="stageTitle"></div><div class="main-sub" id="stageSub"></div></div><div id="stageBadge"></div></div><div class="main-body" id="stageBody"></div></div><aside class="card side"><div class="side-head" id="sideTitle">阶段说明</div><div class="side-body" id="sideBody"></div></aside></section>
</main>
<footer class="footerbar"><div class="footer-inner"><div class="footer-meta"><span>总工作量 <b id="totalEffort">8</b> 人日</span><span>周期 <b>5</b> 工作日</span><span>预计交付 <b>11/11</b></span><span id="saveState"></span></div><div class="actions"><button class="btn" id="save">保存草稿</button><button class="btn primary" id="confirm">确认评估</button></div></div></footer>
<script>
const data={
 stages:[{id:'understanding',name:'需求理解',status:'done'},{id:'breakdown',name:'任务拆解',status:'done'},{id:'estimation',name:'工作量评估',status:'done'},{id:'scheduling',name:'排期生成',status:'done'},{id:'review',name:'人工确认',status:'pending'}],
 understanding:{goal:'用户可以查看活动信息、提交报名，并查询报名状态。',scope:['活动详情展示','报名表单与提交','报名状态查询','基础异常处理'],out_of_scope:['支付','审批流','消息通知'],modules:['活动详情前端','报名服务','活动服务','报名数据表'],assumptions:['复用现有用户体系','默认不限制总报名人数','默认不允许重复报名']},
 clarifications:[{id:'Q1',type:'choice',q:'活动是否限制总报名人数？',ai:'不限制',value:null,custom:'',options:['不限制','有限制'],impact:'影响 BE-01 并发控制与一致性设计'},{id:'Q2',type:'choice',q:'是否允许同一用户重复报名？',ai:'不允许',value:null,custom:'',options:['不允许','允许'],impact:'影响 BE-01 / BE-03 校验和数据约束'},{id:'Q3',type:'text',q:'还有哪些关键业务规则需要补充？',ai:'暂无',value:'',impact:'补充内容会参与后续任务拆解和估算'}],
 tasks:[
  {id:'FE-01',title:'活动详情页面',category:'frontend',desc:'活动详情、报名入口和状态展示',effort:1.5,confidence:'高',owner:'前端 B',start:'2026-11-05',end:'2026-11-06',deps:[],basis:['详情结构 0.5d','状态交互 0.5d','异常态与自测 0.5d']},
  {id:'FE-02',title:'报名交互与接口接入',category:'frontend',desc:'报名表单、校验、接口调用及异常反馈',effort:1.5,confidence:'中',owner:'前端 B',start:'2026-11-09',end:'2026-11-10',deps:['FE-01','BE-01'],basis:['表单与校验 0.5d','接口接入 0.5d','异常处理与自测 0.5d']},
  {id:'BE-01',title:'报名核心接口',category:'backend',desc:'报名提交、参数校验、幂等和异常处理',effort:2,confidence:'中',owner:'后端 A',start:'2026-11-05',end:'2026-11-06',deps:[],basis:['领域逻辑 1d','幂等与异常 0.5d','单测与自测 0.5d']},
  {id:'BE-02',title:'活动状态管理',category:'backend',desc:'活动报名状态与状态判断逻辑',effort:1,confidence:'高',owner:'后端 C',start:'2026-11-05',end:'2026-11-05',deps:[],basis:['状态模型与逻辑 1d']},
  {id:'BE-03',title:'报名数据模型与查询',category:'backend',desc:'报名记录模型与基础查询',effort:1,confidence:'高',owner:'后端 C',start:'2026-11-09',end:'2026-11-09',deps:['BE-01'],basis:['数据模型 DAO 0.5d','查询能力 0.5d']},
  {id:'QA-01',title:'联调与验收',category:'other',desc:'前后端联调、主流程与异常场景检查',effort:1,confidence:'中',owner:'后端 A',start:'2026-11-11',end:'2026-11-11',deps:['FE-02','BE-02','BE-03'],basis:['主流程联调 0.5d','异常场景验收 0.5d']}
 ], summary:{critical:['BE-01','FE-02','QA-01'],days:['2026-11-05','2026-11-06','2026-11-09','2026-11-10','2026-11-11']}
};
let active='understanding',selected='BE-01',showCritical=true;const $=s=>document.querySelector(s),typeName={frontend:'前端',backend:'后端',other:'其他'},fmt=d=>d.slice(5).replace('-','/');
function progress(){const answered=data.clarifications.filter(x=>x.value).length;return 80+Math.round(answered/data.clarifications.length*20)}
function renderStages(){const p=progress();$('#progressNum').textContent=p+'%';$('#progressFill').style.width=p+'%';$('#stages').innerHTML=data.stages.map((s,i)=>'<div class="stage '+s.status+' '+(active===s.id?'active':'')+'" data-stage="'+s.id+'"><span class="dot">'+(s.status==='done'?'✓':'!')+'</span>'+s.name+'</div>'+(i<data.stages.length-1?'<span class="arrow">→</span>':'')).join('');document.querySelectorAll('.stage').forEach(el=>el.onclick=()=>{active=el.dataset.stage;render()})}
function clarificationForm(){return '<div class="section"><h3>待确认</h3>'+data.clarifications.map(c=>{let control='';if(c.type==='choice'){control='<div class="choice">'+[...c.options,'自定义'].map(o=>'<button data-q="'+c.id+'" data-v="'+o+'" class="'+(c.value===o?'active':'')+'">'+o+'</button>').join('')+'</div>'+(c.value==='自定义'?'<input class="input" data-custom="'+c.id+'" style="margin-top:7px" placeholder="请输入自定义答案" value="'+c.custom+'">':'')}else control='<textarea class="textarea" data-text="'+c.id+'" placeholder="请输入补充信息">'+c.value+'</textarea>';return '<div class="qrow"><div><div class="qtitle">'+c.q+'</div><div class="qhint">AI 当前判断：'+c.ai+' · '+c.impact+'</div></div><div>'+control+'</div></div>'}).join('')+'</div>'}
function bindClarifications(){document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const c=data.clarifications.find(x=>x.id===b.dataset.q);c.value=b.dataset.v;render()});document.querySelectorAll('[data-custom]').forEach(i=>i.onchange=()=>{data.clarifications.find(x=>x.id===i.dataset.custom).custom=i.value});document.querySelectorAll('[data-text]').forEach(i=>i.onchange=()=>{data.clarifications.find(x=>x.id===i.dataset.text).value=i.value;renderStages()})}
function renderUnderstanding(){$('#stageTitle').textContent='需求理解';$('#stageSub').textContent='确认 AI 对目标、范围、模块和假设的理解是否正确。';$('#stageBadge').innerHTML='<span class="chip purple">Scope / Assumption / Unknown</span>';$('#stageBody').innerHTML='<div class="grid3"><div class="info"><h3>目标</h3><p>'+data.understanding.goal+'</p></div><div class="info"><h3>涉及范围</h3><ul>'+data.understanding.scope.map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="info"><h3>不在范围</h3><ul>'+data.understanding.out_of_scope.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div><div class="section"><h3>涉及模块</h3><div class="tags">'+data.understanding.modules.map(x=>'<span class="tag">'+x+'</span>').join('')+'</div></div><div class="section"><h3>AI 假设</h3><div class="list">'+data.understanding.assumptions.map(x=>'<div class="row"><div class="label">假设</div><div class="value">'+x+'</div></div>').join('')+'</div></div>'+clarificationForm();bindClarifications();$('#sideTitle').textContent='本阶段产物';$('#sideBody').innerHTML='<div class="basis"><b>AI 产物</b><p>目标、范围、非范围、涉及模块、关键假设、待澄清项。</p></div><div class="basis"><b>人工检查</b><p>是否理解错需求、漏掉范围、错误假设业务规则。</p></div>'}
function taskTable(){return '<table class="task-table"><thead><tr><th>任务</th><th>类型</th><th>说明</th><th>依赖</th></tr></thead><tbody>'+data.tasks.map(t=>'<tr data-task="'+t.id+'"><td><span class="task-id">'+t.id+'</span> '+t.title+'</td><td><span class="type '+t.category+'">'+typeName[t.category]+'</span></td><td>'+t.desc+'</td><td>'+(t.deps.join('、')||'—')+'</td></tr>').join('')+'</tbody></table>'}
function renderBreakdown(){$('#stageTitle').textContent='任务拆解';$('#stageSub').textContent='检查 AI 是否把需求拆成完整、可执行、依赖清晰的研发工作项。';$('#stageBadge').innerHTML='<span class="chip purple">'+data.tasks.length+' 个工作项</span>';$('#stageBody').innerHTML=taskTable()+'<div style="margin-top:12px"><button class="btn">+ 新增任务</button></div>';document.querySelectorAll('[data-task]').forEach(r=>r.onclick=()=>{selected=r.dataset.task;renderBreakdownSide()});renderBreakdownSide()}
function renderBreakdownSide(){const t=data.tasks.find(x=>x.id===selected);$('#sideTitle').textContent='任务拆解依据';$('#sideBody').innerHTML='<div class="basis"><b>'+t.id+' · '+t.title+'</b><p>'+t.desc+'</p></div><h3>为什么需要</h3><p>'+(t.category==='frontend'?'承接用户侧页面与交互闭环。':t.category==='backend'?'承接服务端业务规则、数据和接口能力。':'作为开发完成后的联调与验收收口。')+'</p><h3>前置依赖</h3><p>'+(t.deps.join('、')||'无')+'</p><div style="margin-top:12px"><button class="btn">修改任务</button> <button class="btn">删除</button></div>'}
function renderEstimation(){$('#stageTitle').textContent='工作量评估';$('#stageSub').textContent='查看每项任务的人日、置信度、拆分依据和不确定因素，并允许人工调整。';$('#stageBadge').innerHTML='<span class="chip purple">'+data.tasks.reduce((a,t)=>a+t.effort,0)+' 人日</span>';$('#stageBody').innerHTML='<div class="metric-grid"><div class="metric"><b>'+data.tasks.reduce((a,t)=>a+t.effort,0)+'</b><span>总人日</span></div><div class="metric"><b>'+data.tasks.filter(t=>t.confidence==='中').length+'</b><span>中置信度任务</span></div><div class="metric"><b>'+data.tasks.filter(t=>t.confidence==='高').length+'</b><span>高置信度任务</span></div></div><table class="task-table"><thead><tr><th>任务</th><th>类型</th><th>AI 估算</th><th>置信度</th><th>人工调整</th></tr></thead><tbody>'+data.tasks.map(t=>'<tr data-task="'+t.id+'"><td><span class="task-id">'+t.id+'</span> '+t.title+'</td><td><span class="type '+t.category+'">'+typeName[t.category]+'</span></td><td>'+t.effort+'d</td><td>'+t.confidence+'</td><td><input class="inline-edit effort" data-effort="'+t.id+'" type="number" step=".5" min=".5" value="'+t.effort+'"></td></tr>').join('')+'</tbody></table>';document.querySelectorAll('[data-task]').forEach(r=>r.onclick=e=>{if(e.target.tagName==='INPUT')return;selected=r.dataset.task;renderEstimationSide()});document.querySelectorAll('[data-effort]').forEach(i=>i.onchange=()=>{data.tasks.find(t=>t.id===i.dataset.effort).effort=+i.value;$('#totalEffort').textContent=data.tasks.reduce((a,t)=>a+t.effort,0);renderEstimation()});renderEstimationSide()}
function renderEstimationSide(){const t=data.tasks.find(x=>x.id===selected);$('#sideTitle').textContent='估算依据';$('#sideBody').innerHTML='<div class="basis"><b>'+t.id+' · '+t.title+'</b><p>AI 估算 '+t.effort+' 人日 · '+t.confidence+'置信度</p></div><h3>估算拆分</h3><ul>'+t.basis.map(x=>'<li>'+x+'</li>').join('')+'</ul><h3>不确定因素</h3><div class="risk">'+(t.id==='BE-01'?'若存在报名名额限制，可能额外增加 0.5–1 人日用于并发控制和一致性处理。':'当前没有显著额外不确定因素。')+'</div>'}
function gantt(){const days=data.summary.days;let h='<div class="ghead"><div>任务</div><div>负责人</div><div>人日</div><div>开始</div><div>结束</div>'+days.map(d=>'<div>'+fmt(d)+'</div>').join('')+'</div>';['frontend','backend','other'].forEach(c=>{const ts=data.tasks.filter(t=>t.category===c);h+='<div class="ggroup"><div>'+typeName[c]+' · '+ts.length+' 项</div><div></div></div>';ts.forEach(t=>{h+='<div class="grow '+(selected===t.id?'selected':'')+'" data-task="'+t.id+'"><div class="gcell"><span class="task-id">'+t.id+'</span> '+t.title+'</div><div class="gcell"><select class="inline-edit owner" data-owner="'+t.id+'">'+['前端 B','后端 A','后端 C'].map(o=>'<option '+(o===t.owner?'selected':'')+'>'+o+'</option>').join('')+'</select></div><div class="gcell"><input class="inline-edit" data-effort="'+t.id+'" type="number" step=".5" min=".5" value="'+t.effort+'"></div><div class="gcell"><input class="inline-edit" data-start="'+t.id+'" type="date" value="'+t.start+'"></div><div class="gcell"><input class="inline-edit" data-end="'+t.id+'" type="date" value="'+t.end+'"></div>';days.forEach(d=>{h+='<div class="gday">';if(d===t.start){const span=Math.max(1,days.indexOf(t.end)-days.indexOf(t.start)+1);h+='<div class="bar '+t.category+' '+(showCritical&&data.summary.critical.includes(t.id)?'critical':'')+'" style="width:calc('+span+'00% - 12px)">'+t.id+'</div>'}h+='</div>'});h+='</div>'})});return h}
function renderScheduling(){$('#stageTitle').textContent='排期生成';$('#stageSub').textContent='查看负责人、日期、依赖和关键路径，并直接修改 AI 给出的排期建议。';$('#stageBadge').innerHTML='<label class="chip"><input id="critical" type="checkbox" '+(showCritical?'checked':'')+'> 关键路径</label>';$('#stageBody').innerHTML='<div class="gantt-wrap"><div class="gantt">'+gantt()+'</div></div>';$('#critical').onchange=e=>{showCritical=e.target.checked;renderScheduling()};document.querySelectorAll('[data-task]').forEach(r=>r.onclick=e=>{if(['INPUT','SELECT','OPTION'].includes(e.target.tagName))return;selected=r.dataset.task;renderScheduling()});document.querySelectorAll('[data-owner]').forEach(i=>i.onchange=()=>{data.tasks.find(t=>t.id===i.dataset.owner).owner=i.value});document.querySelectorAll('[data-effort]').forEach(i=>i.onchange=()=>{data.tasks.find(t=>t.id===i.dataset.effort).effort=+i.value;$('#totalEffort').textContent=data.tasks.reduce((a,t)=>a+t.effort,0)});document.querySelectorAll('[data-start]').forEach(i=>i.onchange=()=>{data.tasks.find(t=>t.id===i.dataset.start).start=i.value;renderScheduling()});document.querySelectorAll('[data-end]').forEach(i=>i.onchange=()=>{data.tasks.find(t=>t.id===i.dataset.end).end=i.value;renderScheduling()});renderSchedulingSide()}
function renderSchedulingSide(){const t=data.tasks.find(x=>x.id===selected);$('#sideTitle').textContent='排期解释';$('#sideBody').innerHTML='<div class="basis"><b>'+t.id+' · '+t.title+'</b><p>'+t.owner+' · '+t.effort+' 人日 · '+fmt(t.start)+' → '+fmt(t.end)+'</p></div><h3>为什么这样排</h3><p>'+(t.deps.length?'该任务需要等待 '+t.deps.join('、')+' 完成后开始。':'没有前置依赖，可以尽早启动。')+'</p><h3>关键路径</h3><p>'+(data.summary.critical.includes(t.id)?'该任务位于关键路径，延迟会直接影响预计交付日期。':'当前不在关键路径上。')+'</p>'}
function renderReview(){$('#stageTitle').textContent='人工确认';$('#stageSub').textContent='集中检查仍未确认的输入和人工修改，完成后确认整份评估。';$('#stageBadge').innerHTML='<span class="chip purple">最终确认</span>';$('#stageBody').innerHTML=clarificationForm();bindClarifications();$('#sideTitle').textContent='确认状态';const pending=data.clarifications.filter(c=>c.id!=='Q3'&&!c.value).length;$('#sideBody').innerHTML='<div class="basis"><b>待确认 '+pending+' 项</b><p>所有必填确认完成后，可以提交最终评估。</p></div>'}
function render(){renderStages();if(active==='understanding')renderUnderstanding();else if(active==='breakdown')renderBreakdown();else if(active==='estimation')renderEstimation();else if(active==='scheduling')renderScheduling();else renderReview();$('#confirm').disabled=data.clarifications.filter(c=>c.id!=='Q3'&&!c.value).length>0}
$('#save').onclick=()=>{$('#saveState').textContent='✓ 已保存';setTimeout(()=>$('#saveState').textContent='',1500)};$('#confirm').onclick=()=>{if($('#confirm').disabled)return;$('#confirm').textContent='已确认';$('#confirm').disabled=true};$('#rerun').onclick=()=>location.reload();render();
</script></body></html>
