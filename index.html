order-radius:7px;padding:6px}.module-table input:hover,.module-table input:focus,.task-table input:hover,.task-table input:focus,.task-table select:hover,.task-table select:focus,.inline-edit:hover,.inline-edit:focus{border-color:#c8c2fa;background:#fff;outline:none}.icon-btn{border:0;background:transparent;color:#8a91a0;cursor:pointer}.qrow{display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,1.15fr);gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}.qtitle{font-size:12px;font-weight:750}.qhint{font-size:10px;color:var(--muted);margin-top:4px}.choice{display:flex;gap:7px;flex-wrap:wrap}.choice button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:11px;cursor:pointer}.choice button.active{background:var(--purpleSoft);color:var(--purple);border-color:#beb7ff}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px}.textarea{min-height:68px}.task-id{font-size:9px;background:#f1f2f6;padding:2px 5px;border-radius:5px}.type{font-size:10px;padding:3px 7px;border-radius:999px}.frontend{background:var(--greenSoft);color:var(--green)}.backend{background:var(--blueSoft);color:var(--blue)}.other{background:var(--amberSoft);color:var(--amber)}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.metric{border:1px solid var(--line);border-radius:12px;padding:13px}.metric b{display:block;font-size:20px}.metric span{font-size:10px;color:var(--muted)}.gantt-wrap{overflow:auto}.gantt{min-width:1080px}.ghead,.grow,.ggroup{display:grid;grid-template-columns:270px 110px 72px 92px 92px repeat(var(--days),minmax(78px,1fr))}.ghead{background:#fafbfe;font-size:10px;color:#687080;font-weight:700}.ghead>div,.gcell,.gday{padding:9px 8px;border-right:1px solid #eef0f5;border-bottom:1px solid #eef0f5}.ggroup{background:#fcfcff;font-size:11px;font-weight:750}.ggroup>div:first-child{grid-column:1/6;padding:9px 10px;border-bottom:1px solid var(--line)}.ggroup>div:last-child{grid-column:6/-1;border-bottom:1px solid var(--line)}.grow{min-height:54px;font-size:11px}.gday{position:relative;padding:0}.bar{position:absolute;left:6px;top:14px;height:24px;border-radius:7px;color:#fff;padding:0 8px;display:flex;align-items:center;font-size:9px;font-weight:800;white-space:nowrap}.bar.frontend{background:#42ad76}.bar.backend{background:#577fdf}.bar.other{background:#d39a43}.bar.critical{outline:2px solid rgba(101,87,230,.35);outline-offset:2px}.footerbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line)}.footer-inner{max-width:1640px;margin:auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}.footer-meta{display:flex;gap:18px;font-size:11px;color:#5e6574}.error{margin-top:12px;padding:14px;color:#a5483d;background:#fff0ec;border:1px solid #f0c9c1;border-radius:12px;display:none}.notice{margin-top:12px;padding:12px 14px;background:var(--amberSoft);color:#94691f;border:1px solid #f0d9a8;border-radius:12px;font-size:12px;display:none;line-height:1.7}.warn-inline{background:var(--amberSoft);color:#94691f;border-radius:8px;padding:9px 11px;font-size:11px;margin:10px 0;line-height:1.6}.empty-state{padding:40px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}.markdown{font-size:13px;line-height:1.75;color:#303a4d}.markdown h1,.markdown h2,.markdown h3{margin:18px 0 8px;line-height:1.4}.markdown h1{font-size:20px}.markdown h2{font-size:16px;border-bottom:1px solid var(--line);padding-bottom:6px}.markdown h3{font-size:14px}.markdown p{margin:8px 0}.markdown ul,.markdown ol{margin:8px 0;padding-left:22px}.markdown li{margin:3px 0}.markdown blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid #c8c2fa;background:#fafaff;color:#5e6574}.markdown table{border-collapse:collapse;margin:10px 0;font-size:12px}.markdown table th,.markdown table td{border:1px solid var(--line);padding:6px 10px}.markdown table th{background:#fafbfe}.markdown code{background:#f1f2f6;border-radius:4px;padding:1px 5px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.markdown hr{border:0;border-top:1px solid var(--line);margin:14px 0}.markdown strong{font-weight:800}.markdown pre{background:#f6f7fb;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto}.markdown pre code{background:transparent;padding:0}.data-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:5px 10px;border-radius:999px}.data-badge.demo{background:var(--amberSoft);color:#94691f}.data-badge.real{background:var(--greenSoft);color:var(--green)}@media(max-width:800px){.grid3,.metric-grid{grid-template-columns:1fr}.qrow{grid-template-columns:1fr}.hero{flex-direction:column}.flow{align-items:flex-start;flex-direction:column}.entry{flex-direction:column;align-items:stretch}.footerbar{position:static}}

<body>
<header class="topbar"><div class="brand"><div class="logo">✦</div><div>xdpai</div><div>需求智能评估与排期</div></div><div style="font-size:12px;color:var(--muted)">AI 评估草案 · 只读直连</div></header>
<main class="wrap">
  <section class="card entry">
    <div style="flex:1">
      <div style="display:flex;gap:10px">
        <input id="taskIdInput" placeholder="输入 XDPai Task ID（如 8b4dd104-eec2-40b4-9160-85ae0a7d788b）" value=""/>
        <button class="btn primary" id="loadBtn">加载需求</button>
      </div>
      <div class="hint">支持 URL 参数 <code>?task_id=xxx</code> 自动加载；数据由页面运行时直连 XDPai 网关（credentials: include）获取。</div>
    </div>
  </section>

  <div class="error" id="error"></div>
  <div class="notice" id="notice"></div>

  <section class="card hero" id="heroCard" style="display:none">
    <div>
      <h1 id="title">—</h1>
      <p id="desc"></p>
      <div class="tags">
        <span class="tag purple" id="dataBadge">—</span>
        <span class="tag" id="reqId"></span>
        <span class="tag" id="priority"></span>
        <span class="tag" id="status"></span>
        <span class="tag" id="pendingTag"></span>
      </div>
    </div>
    <button class="btn" id="reloadBtn">重新加载</button>
  </section>

  <section class="card flow" id="flowCard" style="display:none">
    <div class="progress"><div style="font-size:10px;color:var(--muted)">阶段生成</div><div class="progress-line"><div class="progress-num" id="progressNum">0/4</div><div class="track"><div class="fill" id="progressFill"></div></div></div></div>
    <div class="stages" id="stages"></div>
  </section>

  <section class="card main" id="mainCard" style="display:none">
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="requirement">需求</div>
      <div class="tab" data-tab="understanding">需求理解</div>
      <div class="tab" data-tab="breakdown">任务拆解</div>
      <div class="tab" data-tab="estimation">工作量评估</div>
      <div class="tab" data-tab="scheduling">排期生成</div>
    </div>
    <div class="main-head">
      <div><div class="main-title" id="stageTitle"></div><div class="main-sub" id="stageSub"></div></div>
      <div id="stageBadge"></div>
    </div>
    <div class="main-body" id="stageBody"></div>

</main>
<footer class="footerbar" id="footerbar" style="display:none">
  <div class="footer-inner">
    <div class="footer-meta"><span>总工作量 <b id="totalEffort">—</b> 人日</span><span>周期 <b id="duration">—</b> 工作日</span><span>预计交付 <b id="delivery">—</b></span><span id="saveState"></span></div>
    <div style="display:flex;gap:8px"><button class="btn" id="exportBtn">导出本 Tab JSON</button> <button class="btn primary" id="saveBtn">提交变更</button></div>
  </div>
</footer>
<!-- 对话浮层入口 -->
<button id="chatFab" class="chat-fab" title="与 AI 对话" style="display:none">💬</button>
<!-- 对话浮层 -->
<div id="chatPanel" class="chat-panel" style="display:none">
  <div class="chat-head">
    <span class="chat-title">任务会话</span>
    <div class="chat-head-actions">
      <button id="chatRefresh" class="chat-head-btn" title="刷新消息">⟳</button>
      <button id="chatClose" class="chat-head-btn" title="关闭">✕</button>
    </div>
  </div>
  <div id="chatList" class="chat-list"></div>
  <div class="chat-input-bar">
    <textarea id="chatText" class="chat-textarea" placeholder="输入消息，Enter 发送 / Shift+Enter 换行" rows="1"></textarea>
    <button id="chatSend" class="btn primary" title="发送">发送</button>
  </div>
</div>
<script>
'use strict';
// ==================== API 契约（见 spec/xdpai-mini-app/api.md） ====================
const GATEWAY = {
  task: 'https://xdclaw.woa.com/xdpai.gateway.taskcgi.taskcgi',
  workflow: 'https://xdclaw.woa.com/xdpai.gateway.workflowcgi.workflowcgi',
};
const VAR_KEYS = {
  init: 'requirement_arrangement.init',
  understanding: 'requirement_arrangement.understanding',
  breakdown: 'requirement_arrangement.breakdown',
  estimation: 'requirement_arrangement.estimation',
  scheduling: 'requirement_arrangement.scheduling',
};
const VAR_TO_TAB = { init:'requirement', understanding:'understanding', breakdown:'breakdown', estimation:'estimation', scheduling:'scheduling' };
const STAGE_ORDER = [['understanding','需求理解'],['breakdown','任务拆解'],['estimation','工作量评估'],['scheduling','排期生成']];
const STAGE_LABEL = { pending:'待生成', ready:'就绪', completed:'已完成', stale:'需重新生成' };
const typeName = { frontend:'前端', backend:'后端', other:'其他' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => d ? String(d).slice(5).replace('-','/') : '—';

// ==================== 应用状态 ====================
let S = {
  taskId: '',
  task: null,           // GetTask 返回
  instance: null,       // GetInstance 返回
  init: null, understanding: null, breakdown: null, estimation: null, scheduling: null,
  varsRaw: {},          // 原始 variables_json 对象
  missing: {},          // 每个阶段是否缺失/解析失败
  active: 'requirement',
  demo: false,          // 是否处于演示数据回退
  dirty: {},            // 每个 Tab 是否被编辑过
  original: {},         // 加载时的原始快照，用于 diff 出「人改了哪些字段」
};

// ==================== 服务层 ====================
async function rpc(base, method, body) {
  const res = await fetch(base + '/' + method, {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  if (res.status === 302 || res.redirected) {
    const e = new Error('未登录（网关重定向到登录页）');
    e.code = 'NOT_LOGIN'; throw e;
  }
  if (!res.ok) { const e = new Error('HTTP ' + res.status); e.code = 'HTTP'; e.status = res.status; throw e; }
  return res.json();
}
async function getTask(taskId) { return rpc(GATEWAY.task, 'GetTask', { task_id: taskId }); }
async function getInstance(taskId) { return rpc(GATEWAY.workflow, 'GetInstance', { task_id: taskId }); }

// 解析单个变量值：可能是 JSON 字符串 / 纯文本 / 已解析对象
function parseVar(raw) {
  if (raw === null || raw === undefined) return null;
  if (typeof raw === 'object') return raw;
  if (typeof raw !== 'string') return raw;
  const t = raw.trim();
  if (t === '') return null;
  try { return JSON.parse(t); } catch { return t; }
}

// ==================== 加载流程 ====================
async function load(taskId) {
  taskId = String(taskId || '').trim();
  if (!taskId) { showError('请输入 XDPai Task ID。'); return; }
  reset();
  S.taskId = taskId;
  $('#loadBtn').disabled = true; $('#loadBtn').textContent = '加载中…';
  hideError(); hideNotice();
  try {
    // 1) 读任务（需求）
    let taskRsp;
    try { taskRsp = await getTask(taskId); }
    catch (e) {
      if (e.code === 'HTTP' && e.status === 404) throw Object.assign(new Error('未找到该 XDPai Task。'), { code:'NOT_FOUND' });
      throw e;
    }
    S.task = taskRsp && (taskRsp.task || taskRsp.data || taskRsp);
    if (!S.task || !S.task.title) throw Object.assign(new Error('未找到该 XDPai Task。'), { code:'NOT_FOUND' });

    // 2) 读流程实例（workflow vars + 节点）
    try {
      const instRsp = await getInstance(taskId);
      S.instance = instRsp && (instRsp.instance || instRsp.data || instRsp);
      parseInstanceVars();
    } catch (e) {
      // SOP 未运行 / 无实例：需求 Tab 仍正常展示，其余显示「尚未生成」
      S.instance = null;
      S.varsRaw = {};
      setMissingAll('该阶段尚未生成（SOP 未运行或无流程实例）。');
    }

    saveOriginal();
    renderAll();
    initChat();
  } catch (e) {
    showError(humanError(e));
  } finally {
    $('#loadBtn').disabled = false; $('#loadBtn').textContent = '加载需求';
  }
}

function parseInstanceVars() {
  S.missing = {};
  let varsObj = {};
  const vj = S.instance && S.instance.variables_json;
  if (vj && typeof vj === 'string') { try { varsObj = JSON.parse(vj); } catch { /* 非法 JSON，按全缺失处理 */ } }
  else if (vj && typeof vj === 'object') varsObj = vj;
  S.varsRaw = varsObj || {};

  for (const [stage, key] of Object.entries(VAR_KEYS)) {
    const raw = S.varsRaw[key];
    if (raw === undefined || raw === null || raw === '') {
      S[stage] = null;
      S.missing[stage] = '该阶段尚未生成。';
    } else {
      const parsed = parseVar(raw);
      if (parsed === null || typeof parsed !== 'object') {
        S[stage] = null;
        S.missing[stage] = '「' + key + '」数据格式异常（非法 JSON）。';
      } else {
        S[stage] = parsed;
      }
    }
  }
  // init 里带 stage_status 与 requirement 快照
  if (S.init && S.init.stage_status) { /* 保留 */ }
  else if (S.init && S.init.requirement) { /* init 只有 requirement，无 stage_status */ }
}

function setMissingAll(msg) {
  for (const stage of Object.keys(VAR_KEYS)) S.missing[stage] = msg;
}

function reset() {
  S.task = null; S.instance = null;
  S.init = S.understanding = S.breakdown = S.estimation = S.scheduling = null;
  S.varsRaw = {}; S.missing = {}; S.active = 'requirement'; S.demo = false; S.dirty = {}; S.original = {};
  ['heroCard','flowCard','mainCard','footerbar'].forEach(id => $('#'+id).style.display = 'none');
}

// 保存加载时的原始快照（用于 diff）
function saveOriginal() {
  S.original = {};
  ['understanding', 'breakdown', 'estimation', 'scheduling'].forEach(st => {

// ==================== 轻量 Markdown 渲染 ====================
function markdown(src) {
  if (!src) return '<p>（无内容）</p>';
  const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  let html = '', inList = false, listTag = '', inTable = false, rows = [];
  const closeList = () => { if (inList) { html += '</' + listTag + '>'; inList = false; } };
  const closeTable = () => { if (inTable) { html += renderTable(rows); inTable = false; rows = []; } };
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');

  for (const raw of lines) {
    const line = raw.trimEnd();
    // 表格
    if (/^\|.*\|$/.test(line.trim())) {
      closeList();
      const cells = line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) { rows.push({ sep: true }); }
      else { rows.push({ cells }); }
      if (!inTable) inTable = true;
      continue;
    } else closeTable();
    // 标题
    const hm = line.match(/^(#{1,6})\s+(.*)$/);
    if (hm) { closeList(); const lv = hm[1].length; html += '<h' + lv + '>' + inline(hm[2]) + '</h' + lv + '>'; continue; }
    // 分隔线
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { closeList(); html += '<hr>'; continue; }
    // 引用
    if (/^\s*>\s?/.test(line)) { closeList(); html += '<blockquote>' + inline(line.replace(/^\s*>\s?/, '')) + '</blockquote>'; continue; }
    // 列表
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const tag = ul ? 'ul' : 'ol';
      if (!inList || listTag !== tag) { closeList(); html += '<' + tag + '>'; inList = true; listTag = tag; }
      html += '<li>' + inline((ul || ol)[1]) + '</li>';
      continue;
    }
    closeList();
    if (line.trim() === '') { html += ''; continue; }
    html += '<p>' + inline(line) + '</p>';
  }
  closeList(); closeTable();
  return html;
}
function renderTable(rows) {
  const data = rows.filter(r => !r.sep);
  if (!data.length) return '';
  let h = '<table><thead><tr>';
  data[0].cells.forEach(c => { h += '<th>' + esc(c) + '</th>'; });
  h += '</tr></thead><tbody>';
  for (let i = 1; i < data.length; i++) {
    h += '<tr>';
    data[i].cells.forEach(c => { h += '<td>' + esc(c) + '</td>'; });
    h += '</tr>';
  }
  h += '</tbody></table>';
  return h;
}

  });
}

// ==================== 空态 / 提示 ====================
function emptyStage(varName) {
  return '<div class="empty-state">' + (S.missing[S.active] || '该阶段尚未生成。') + '<br><span style="font-size:11px">对应变量：' + esc(varName) + '</span></div>';
}
function warnInline(msg) { return '<div class="warn-inline">⚠ ' + esc(msg) + '</div>'; }

// ==================== 编辑状态 / stale 计算 ====================
function markDirty(stage) {
  S.dirty[stage] = true;
  // 上游修改 → 下游 stale
  const order = ['understanding', 'breakdown', 'estimation', 'scheduling'];
  const idx = order.indexOf(stage);
  if (idx >= 0) {
    for (let i = idx + 1; i < order.length; i++) {
      const downstream = order[i];
      if (S[downstream] && S.dirty[stage]) {
        // 在前端标记下游 stale（真实写回时由后端联动，这里仅展示）
        if (S.init && S.init.stage_status && S.init.stage_status[downstream] === 'completed') {
          S.init.stage_status[downstream] = 'stale';
        }
      }
    }
  }
  renderStages();
}

// ==================== 提交变更 ====================
// 浏览器直连写 workflow var 的网关（workflowcgi）未透传 SetWorkflowVar；mcp 网关 CORS 拦截。
// 但「发消息」的网页网关 imcgi（xdclaw.woa.com）有 CORS 白名单 + cookie 鉴权，浏览器可达。
// 因此提交变更走「发消息」：页面把「人改了哪些字段」发到任务会话，由会话中的 AI 助手（有 XDPAI_MCP_TOKEN）
// 更新变量并回退到下游节点重新评估。待平台透传 SetWorkflowVar 后可改直连（见 spec/xdpai-mini-app/api.md §3）。
const GATEWAY_IM = 'https://xdclaw.woa.com/xdpai.gateway.imcgi.imcgi';
const STAGE_NAME = { understanding: '需求理解', breakdown: '任务拆解', estimation: '工作量评估', scheduling: '排期生成' };
const STAGE_ROLLBACK = { understanding: '任务拆解', breakdown: '工作量评估', estimation: '排期生成', scheduling: '排期生成' };
const FIELD_LABEL = {
  effort_days: '人日', confidence: '置信度',
  title: '标题', module_id: '模块', category: '类型', description: '说明', dependencies: '依赖',
  name: '模块名', repository: '仓库', change_summary: '主要改动',
  assignee: '负责人', start_date: '开始日期', end_date: '结束日期',
};
function currentVarForTab() {
  const map = { requirement: null, understanding: 'understanding', breakdown: 'breakdown', estimation: 'estimation', scheduling: 'scheduling' };
  const stage = map[S.active];
  if (!stage) return null;
  const key = VAR_KEYS[stage];
  const data = S[stage];
  if (!data) return { stage, key, data: null };
  return { stage, key, data };
}
function getConvId() {
  return (S.instance && S.instance.conv_id) || (S.task && S.task.conv_id) || '';
}
function moduleName(id) {
  if (!id) return '(空)';
  const m = (S.understanding && S.understanding.modules || []).find(x => x.id === id);
  return m ? m.name : id;
}
// diff 出「人改了哪些字段」：对比原始快照与当前数据
function diffStage(stage) {
  const orig = S.original[stage];
  const curr = S[stage];
  if (!orig || !curr) return [];
  const changes = [];
  const push = (target, field, from, to) => changes.push({ target, field, from, to });

  if (stage === 'estimation') {
    const om = new Map((orig.estimations || []).map(e => [e.task_id, e]));
    const cm = new Map((curr.estimations || []).map(e => [e.task_id, e]));
    for (const [tid, ce] of cm) {
      const oe = om.get(tid);
      if (!oe) { push(tid, 'effort_days', null, ce.effort_days); continue; }
      if (Number(oe.effort_days) !== Number(ce.effort_days)) push(tid, 'effort_days', oe.effort_days, ce.effort_days);
      if (oe.confidence !== ce.confidence) push(tid, 'confidence', oe.confidence, ce.confidence);
    }
    for (const tid of om.keys()) if (!cm.has(tid)) push(tid, 'effort_days', om.get(tid).effort_days, null);
  }
  else if (stage === 'breakdown') {
    const om = new Map((orig.tasks || []).map(t => [t.id, t]));
    const cm = new Map((curr.tasks || []).map(t => [t.id, t]));
    for (const [id, ct] of cm) {
      const ot = om.get(id);
      if (!ot) { push(id, 'title', null, ct.title); continue; }
      if ((ot.title || '') !== (ct.title || '')) push(id, 'title', ot.title, ct.title);
      if ((ot.module_id || null) !== (ct.module_id || null)) push(id, 'module_id', moduleName(ot.module_id), moduleName(ct.module_id));
      if ((ot.category || '') !== (ct.category || '')) push(id, 'category', ot.category, ct.category);
      if ((ot.description || '') !== (ct.description || '')) push(id, 'description', ot.description, ct.description);
      if (JSON.stringify(ot.dependencies || []) !== JSON.stringify(ct.dependencies || []))
        push(id, 'dependencies', (ot.dependencies || []).join(',') || '(无)', (ct.dependencies || []).join(',') || '(无)');
    }
    for (const id of om.keys()) if (!cm.has(id)) push(id, 'title', om.get(id).title, null);
  }
  else if (stage === 'understanding') {
    const om = new Map((orig.modules || []).map(m => [m.id, m]));
    const cm = new Map((curr.modules || []).map(m => [m.id, m]));
    for (const [id, cmo] of cm) {
      const omo = om.get(id);
      if (!omo) { push(id, 'name', null, cmo.name); continue; }
      if ((omo.name || '') !== (cmo.name || '')) push(id, 'name', omo.name, cmo.name);
      if ((omo.repository || '') !== (cmo.repository || '')) push(id, 'repository', omo.repository || '(空)', cmo.repository || '(空)');
      if ((omo.change_summary || '') !== (cmo.change_summary || '')) push(id, 'change_summary', omo.change_summary, cmo.change_summary);
    }
    for (const id of om.keys()) if (!cm.has(id)) push(id, 'name', om.get(id).name, null);
    const oq = new Map((orig.review_items || []).map(q => [q.id, q]));
    const cq = new Map((curr.review_items || []).map(q => [q.id, q]));
    for (const [id, cqq] of cq) {
      const oqq = oq.get(id); if (!oqq) continue;
      const ov = oqq.value || ''; const cv = cqq.value || '';
      const ocv = oqq.custom_value || ''; const ccv = cqq.custom_value || '';
      if (ov !== cv || ocv !== ccv)
        push(id, 'value', ov || '(未答)', cv === '自定义' ? ccv : cv || '(未答)');
    }
  }
  else if (stage === 'scheduling') {
    const om = new Map((orig.schedule || []).map(s => [s.task_id, s]));
    const cm = new Map((curr.schedule || []).map(s => [s.task_id, s]));
    for (const [tid, cs] of cm) {
      const os = om.get(tid);
      if (!os) { push(tid, 'start_date', null, cs.start_date); continue; }
      if ((os.assignee || '') !== (cs.assignee || '')) push(tid, 'assignee', os.assignee, cs.assignee);
      if ((os.start_date || '') !== (cs.start_date || '')) push(tid, 'start_date', os.start_date, cs.start_date);
      if ((os.end_date || '') !== (cs.end_date || '')) push(tid, 'end_date', os.end_date, cs.end_date);
    }
    for (const tid of om.keys()) if (!cm.has(tid)) push(tid, 'assignee', om.get(tid).assignee, null);
  }
  return changes;
}
// 构造变更通知（diff + 回退节点，用 SOP 自己的术语）
function buildChangeMessage(stage, changes) {
  const lines = changes.map(c => {
    const label = FIELD_LABEL[c.field] || c.field;
    if (c.from === null) return '- ' + c.target + ' ' + label + '（' + c.field + '）：新增为 ' + c.to;
    if (c.to === null) return '- ' + c.target + ' ' + label + '（' + c.field + '）：删除（原「' + c.from + '」）';
    return '- ' + c.target + ' ' + label + '（' + c.field + '）：' + c.from + ' → ' + c.to;
  });
  return '我在工作台（requirement-arrangement-workbench）审查「' + STAGE_NAME[stage] + '」时做了以下修正（human edit，权威）：\n\n'
    + lines.join('\n') + '\n\n'
    + '请先更新 ' + VAR_KEYS[stage] + '（revision.last_modified_by 置为 human，重算 summary），'
    + '然后回退到「' + STAGE_ROLLBACK[stage] + '」节点，让它基于更新后的数据重新评估。';
}
// 通过 imcgi 发变更通知到任务会话
async function sendChangeMessage(stage, changes) {
  const convId = getConvId();
  if (!convId) { flash('未获取到任务会话 ID，无法发消息'); return false; }
  const msg = buildChangeMessage(stage, changes);
  const res = await fetch(GATEWAY_IM + '/SendMessage', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ conversation_id: convId, sender_type: 'user', type: 'text', content: { text: msg } }),
  });
  if (!res.ok) { flash('发消息失败：HTTP ' + res.status); return false; }
  return true;
}
$('#saveBtn').onclick = async () => {
  const info = currentVarForTab();
  if (!info || !info.data) { flash('当前 Tab 无数据可提交'); return; }
  const changes = diffStage(info.stage);
  if (!changes.length) { flash('当前 Tab 未检测到改动'); return; }
  $('#saveBtn').disabled = true; $('#saveBtn').textContent = '发送中…';
  try {
    const ok = await sendChangeMessage(info.stage, changes);
    if (ok) {
      saveOriginal();  // 提交成功后刷新快照，防止再次点击重复发同样的 diff
      flash('已通知 agent：' + STAGE_NAME[info.stage] + ' 有 ' + changes.length + ' 处改动，将回退到「' + STAGE_ROLLBACK[info.stage] + '」重新评估。');
    }
  } catch (e) {
    flash('发消息失败：' + (e && e.message ? e.message : '未知错误'));
  } finally {
    $('#saveBtn').disabled = false; $('#saveBtn').textContent = '提交变更';
  }
};
$('#exportBtn').onclick = () => {
  const info = currentVarForTab();
  if (!info || !info.data) { flash('当前 Tab 无数据可导出'); return; }
  const text = JSON.stringify(info.data, null, 2);
  try { navigator.clipboard.writeText(text); flash('已复制变量「' + info.key + '」的 JSON 到剪贴板'); }
  catch { prompt('复制以下 JSON（变量 ' + info.key + '）：', text); flash('请复制文本'); }
};
function flash(msg) { $('#saveState').textContent = msg; clearTimeout(flash._t); flash._t = setTimeout(() => $('#saveState').textContent = '', 6000); }

// ==================== 错误 / 提示 ====================
function showError(msg) { const e = $('#error'); e.textContent = msg; e.style.display = 'block'; }
function hideError() { $('#error').style.display = 'none'; }
function showNotice(msg) { const n = $('#notice'); n.innerHTML = msg; n.style.display = 'block'; }
function hideNotice() { $('#notice').style.display = 'none'; }

// ==================== 初始化 ====================
$('#loadBtn').onclick = () => load($('#taskIdInput').value);
$('#taskIdInput').addEventListener('keydown', e => { if (e.key === 'Enter') load($('#taskIdInput').value); });
$('#reloadBtn').onclick = () => load(S.taskId || $('#taskIdInput').value);

(function init() {
  const q = new URLSearchParams(location.search).get('task_id');
  if (q) { $('#taskIdInput').value = q; load(q); }
  else {
    // 无 task_id 时展示引导态
    $('#heroCard').style.display = ''; $('#heroCard').querySelector('h1').textContent = '需求智能评估与排期';
    $('#heroCard').querySelector('p').textContent = '输入 XDPai Task ID，读取需求详情与需求智能排期流程变量（需求理解 / 任务拆解 / 工作量评估 / 排期生成）。';
    $('#dataBadge').textContent = '等待输入 Task ID';
  }
})();

// ==================== 对话浮层（复用 imcgi 消息接口，对齐 tipai/web 聊天组件） ====================
let chatUserId = '';  // 当前用户 id（区分 mine/other）

function chatMsgIsMine(m) { return chatUserId && m.sender_id === chatUserId; }
function chatMsgIsAI(m) { return m.sender_type === 'silicon' || m.sender_type === 'agent'; }
function chatSenderName(m) { return m.sender_nickname || m.sender_name || m.sender_id || '未知'; }

async function loadChatMessages() {
  const convId = getConvId();
  if (!convId) { $('#chatList').innerHTML = '<div class="chat-msg"><div class="chat-bubble">未获取到会话 ID，请先加载需求。</div></div>'; return; }
  $('#chatList').innerHTML = '<div class="chat-msg"><div class="chat-bubble" style="color:#b7bcc7">加载消息中…</div></div>';
  try {
    const r = await fetch(GATEWAY_IM + '/GetMessages', {
      method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: convId, limit: 50 }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    let msgs = d.messages || d.list || d.items || [];
    if (Array.isArray(msgs) && msgs.length) msgs = msgs.slice().reverse();  // 倒序返回 → 恢复正序
    renderChatMessages(msgs);
  } catch (e) {
    $('#chatList').innerHTML = '<div class="chat-msg"><div class="chat-bubble">加载失败：' + esc(e && e.message || '') + '</div></div>';
  }
}
function renderChatMessages(msgs) {
  if (!msgs.length) { $('#chatList').innerHTML = '<div class="chat-msg"><div class="chat-bubble" style="color:#b7bcc7">暂无消息</div></div>'; return; }
  $('#chatList').innerHTML = msgs.map(m => {
    const mine = chatMsgIsMine(m);
    const ai = chatMsgIsAI(m);
    const name = chatSenderName(m);
    const text = (m.content && m.content.text) || m.text || '';
    const time = m.created_at ? String(m.created_at).slice(11, 16) : '';
    return '<div class="chat-msg ' + (mine ? 'mine' : '') + '">'
      + '<div class="chat-sender">' + esc(name) + (ai ? '<span class="chat-ai-tag">AI</span>' : '') + '</div>'
      + '<div class="chat-bubble">' + esc(text) + '</div>'
      + '<div class="chat-time">' + time + '</div>'
      + '</div>';
  }).join('');
  const list = $('#chatList'); list.scrollTop = list.scrollHeight;
}
async function sendChatMessage() {
  const convId = getConvId();
  const text = $('#chatText').value.trim();
  if (!convId) { flash('未获取到会话 ID'); return; }
  if (!text) return;
  $('#chatSend').disabled = true; $('#chatSend').textContent = '发送中';
  try {
    const r = await fetch(GATEWAY_IM + '/SendMessage', {
      method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: convId, sender_type: 'user', type: 'text', content: { text } }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    $('#chatText').value = '';
    await loadChatMessages();
  } catch (e) {
    flash('发送失败：' + (e && e.message || ''));
  } finally {
    $('#chatSend').disabled = false; $('#chatSend').textContent = '发送';
  }
}
// 加载成功后初始化：取当前用户 id + 显示入口
async function initChat() {
  try {
    const r = await fetch('/_identity', { credentials: 'include', headers: { Accept: 'application/json' } });
    if (r.ok) { const id = await r.json(); chatUserId = id.uid || ''; }
  } catch (e) { /* 忽略身份获取失败 */ }
  $('#chatFab').style.display = getConvId() ? '' : 'none';
}
$('#chatFab').onclick = () => {
  const panel = $('#chatPanel');
  const show = panel.style.display === 'none';
  panel.style.display = show ? 'flex' : 'none';
  if (show) loadChatMessages();
};
$('#chatClose').onclick = () => { $('#chatPanel').style.display = 'none'; };
$('#chatRefresh').onclick = loadChatMessages;
$('#chatSend').onclick = sendChatMessage;
$('#chatText').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
});
</script>
